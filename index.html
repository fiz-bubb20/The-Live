}
function weekRecords(lg, week){
  const bd = weekPickBreakdown(lg, week);
  return lg.members.map(phone=>{
    let wins=0, losses=0;
    bd.forEach(({g,cover})=>{
      if(!cover || cover==="push") return;
      const pick = (lg.picks[phone]||{})[g.id];
      if(!pick) return;
      if(isPausedForGame(lg, phone, g)){ losses++; return; }
      if(pick===cover) wins++; else losses++;
    });
    const total = wins+losses;
    return { phone, name: DB.users[phone]?.name||"Unknown", wins, losses, total, pct: total?wins/total:null };
  });
}
function priorWeekPct(lg, week, phone){
  const prevWeeks = completedWeeks(lg).filter(w=>w<week);
  if(!prevWeeks.length) return null;
  const r = weekRecords(lg, prevWeeks[prevWeeks.length-1]).find(r=>r.phone===phone);
  return r && r.total>0 ? r.pct : null;
}
// Splits a week's games into an "early" half and the full week by kickoff order, for the
// hot-start-then-collapse / cold-start-then-recover awards.
function halfWeekRecords(lg, week){
  const games = (lg.games[week]||[]).filter(g=>g.status==="final").slice().sort((a,b)=>new Date(a.kickoff)-new Date(b.kickoff));
  const early = games.slice(0, Math.ceil(games.length/2));
  function pctFor(list, phone){
    let wins=0, losses=0;
    list.forEach(g=>{
      const cover = computeCover(g); if(!cover||cover==="push") return;
      const pick = (lg.picks[phone]||{})[g.id]; if(!pick) return;
      if(isPausedForGame(lg,phone,g)){ losses++; return; }
      if(pick===cover) wins++; else losses++;
    });
    const total = wins+losses;
    return total? wins/total : null;
  }
  return lg.members.map(phone=>({ phone, earlyPct: pctFor(early, phone), fullPct: pctFor(games, phone) }));
}
function resolveWeeklySuperlative(key, lg, week){
  const bd = weekPickBreakdown(lg, week);
  if(!bd.length) return null;

  if(key==="dumpster_fire" || key==="hottest"){
    const records = weekRecords(lg, week).filter(r=>r.total>0);
    if(!records.length) return null;
    const wantLow = key==="dumpster_fire";
    const sorted = records.slice().sort((a,b)=> wantLow ? (a.pct-b.pct || a.name.localeCompare(b.name)) : (b.pct-a.pct || a.name.localeCompare(b.name)));
    const top = sorted[0];
    if(wantLow ? top.pct>=0.5 : top.pct<=0.5) return null;
    return { phone: top.phone, stat: `${Math.round(top.pct*100)}% this week` };
  }
  if(key==="public_humiliation"){
    const records = weekRecords(lg, week).filter(r=>r.total>0);
    if(records.length<2) return null;
    const avg = records.reduce((s,r)=>s+r.pct,0)/records.length;
    const worst = records.slice().sort((a,b)=>(a.pct-avg)-(b.pct-avg))[0];
    if(avg-worst.pct < 0.15) return null;
    return { phone: worst.phone, stat: `${Math.round(worst.pct*100)}% vs ${Math.round(avg*100)}% league average` };
  }
  if(key==="doggy_style" || key==="missionary"){
    const side = key==="doggy_style" ? "dog" : "fav";
    const tally = {};
    bd.forEach(({cover,favPhones,dogPhones})=>{
      if(cover!==side) return;
      (side==="fav"?favPhones:dogPhones).forEach(p=> tally[p]=(tally[p]||0)+1);
    });
    const ranked = Object.entries(tally).sort((a,b)=>b[1]-a[1]);
    if(!ranked.length || (ranked.length>1 && ranked[1][1]===ranked[0][1])) return null;
    const [phone,count] = ranked[0];
    return { phone, stat: `${count} successful ${side==='dog'?'underdog':'favorite'} pick${count===1?'':'s'}` };
  }
  if(key==="galaxy_brain" || key==="smooth_brain"){
    const wantRight = key==="galaxy_brain";
    let best = null;
    bd.forEach(({g,cover,favPhones,dogPhones})=>{
      if(!cover || cover==="push") return;
      const rightPhones = cover==="fav"?favPhones:dogPhones, wrongPhones = cover==="fav"?dogPhones:favPhones;
      const total = rightPhones.length+wrongPhones.length;
      if(total<3) return;
      const lone = wantRight ? rightPhones : wrongPhones, crowd = wantRight ? wrongPhones : rightPhones;
      if(lone.length===1 && crowd.length===total-1) best = { phone: lone[0], stat: `${g.fav.n} vs ${g.dog.n}` };
    });
    return best;
  }
  if(key==="red_flag" || key==="circus_clown" || key==="gas_station"){
    let best = null;
    bd.forEach(({g,cover,favPhones,dogPhones})=>{
      if(!cover || cover==="push") return;
      const winnerPhones = cover==="fav"?favPhones:dogPhones, loserPhones = cover==="fav"?dogPhones:favPhones;
      const total = winnerPhones.length+loserPhones.length;
      if(total<3) return;
      if(key==="red_flag" && loserPhones.length>0 && loserPhones.length<winnerPhones.length){
        if(!best || loserPhones.length<best.count) best = { phones:loserPhones, count:loserPhones.length, g };
      } else if(key==="circus_clown" && loserPhones.length>winnerPhones.length){
        if(!best || loserPhones.length>best.count) best = { phones:loserPhones, count:loserPhones.length, g };
      } else if(key==="gas_station" && winnerPhones.length>=2 && winnerPhones.length<loserPhones.length){
        if(!best || winnerPhones.length<best.count) best = { phones:winnerPhones, count:winnerPhones.length, g };
      }
    });
    if(!best) return null;
    const label = key==="gas_station"
      ? `${best.count} people covered on ${best.g.fav.n} vs ${best.g.dog.n} anyway`
      : `${best.g.fav.n} vs ${best.g.dog.n} — ${best.count} took it and lost`;
    return { phone: best.phones[0], stat: label };
  }
  if(key==="should_stay_home"){
    let best = null;
    bd.forEach(({g,cover,favPhones,dogPhones})=>{
      if(!cover || cover==="push" || g.favScore==null || g.dogScore==null || g.spread==null) return;
      const winnerPhones = cover==="fav"?favPhones:dogPhones, loserPhones = cover==="fav"?dogPhones:favPhones;
      if(!loserPhones.length || loserPhones.length>=winnerPhones.length) return; // minority pick that lost
      const margin = Math.abs((g.favScore-g.dogScore) - (-g.spread));
      if(margin>=14 && (!best || margin>best.margin)) best = { phones:loserPhones, g, margin };
    });
    if(!best) return null;
    return { phone: best.phones[0], stat: `${best.g.fav.n} vs ${best.g.dog.n} — missed by ${Math.round(best.margin)}` };
  }
  if(key==="fuck_it_we_ball"){
    let best = null;
    bd.forEach(({g,cover,dogPhones})=>{
      if(cover!=="dog" || !dogPhones.length) return;
      const mag = Math.abs(g.spread);
      if(!best || mag>best.mag) best = { phones:dogPhones, mag, g };
    });
    if(!best) return null;
    return { phone: best.phones[0], stat: `+${best.mag} on ${best.g.dog.n}` };
  }
  if(key==="blue_balls"){
    let best = null;
    bd.forEach(({g,cover})=>{
      if(!cover || cover==="push" || g.favScore==null || g.dogScore==null || g.spread==null) return;
      const margin = Math.abs((g.favScore-g.dogScore) - (-g.spread));
      if(margin!==0.5) return;
      const missedPhones = pickersFor(lg,g,cover==="fav"?"dog":"fav").map(u=>u.phone);
      if(missedPhones.length && !best) best = { phones:missedPhones, g };
    });
    if(!best) return null;
    return { phone: best.phones[0], stat: `Missed covering ${best.g.fav.n} vs ${best.g.dog.n} by half a point` };
  }
  if(key==="broke_clock"){
    for(const r of weekRecords(lg, week).filter(r=>r.total>0)){
      const prev = priorWeekPct(lg, week, r.phone);
      if(prev!=null && prev<0.5 && r.pct>0.5) return { phone: r.phone, stat: `${Math.round(prev*100)}% → ${Math.round(r.pct*100)}%` };
    }
    return null;
  }
  if(key==="premature" || key==="cumback"){
    const halves = halfWeekRecords(lg, week).filter(h=>h.earlyPct!=null && h.fullPct!=null);
    const hit = key==="premature"
      ? halves.find(h=> h.earlyPct>=0.7 && h.fullPct<0.5)
      : halves.find(h=> h.earlyPct<=0.3 && h.fullPct>0.5);
    return hit ? { phone: hit.phone, stat: `Started ${Math.round(hit.earlyPct*100)}%, finished ${Math.round(hit.fullPct*100)}%` } : null;
  }
  return null;
}
// Picks (and permanently locks in) this week's 3 superlatives the first time anyone views the
// recap for it — after that it's read from storage so it never changes on a re-open.
async function ensureWeekSuperlatives(week){
  const code = CURRENT_LEAGUE;
  if(DB.leagues[code]?.weeklySuperlatives?.[week]) return DB.leagues[code].weeklySuperlatives[week];

  // The whole "what's already used, what's left, pick 3" decision lives INSIDE the transaction
  // mutator (not computed once beforehand) — this app has background timers writing to the same
  // shared document every 30s, so reading "already used" outside the transaction and only writing
  // the result inside it is a real race: a concurrent write can land between the read and the
  // write and go unnoticed. Deciding inside the mutator means Firestore's automatic retry-on-
  // conflict re-runs this whole decision against fresh data, closing that gap.
  await mutate(draft=>{
    const dl = draft.leagues[code];
    dl.weeklySuperlatives = dl.weeklySuperlatives || {};
    if(dl.weeklySuperlatives[week]) return; // already decided by an earlier call/retry

    const priorWeeks = Object.keys(dl.weeklySuperlatives).map(w=>parseInt(w,10)).filter(w=>w<week);
    let used = new Set();
    priorWeeks.forEach(w=> (dl.weeklySuperlatives[w]||[]).forEach(a=> used.add(a.key)));
    if(used.size >= WEEKLY_SUPERLATIVE_DEFS.length) used = new Set(); // full cycle done — start over

    const pool = WEEKLY_SUPERLATIVE_DEFS.filter(d=>!used.has(d.key));
    const candidates = (pool.length ? pool : WEEKLY_SUPERLATIVE_DEFS).map(def=>{
      const r = resolveWeeklySuperlative(def.key, dl, week);
      return r ? {key:def.key, phone:r.phone, stat:r.stat} : null;
    }).filter(Boolean);
    shuffleArr(candidates);
    dl.weeklySuperlatives[week] = candidates.slice(0,3);
  });
  return DB.leagues[code].weeklySuperlatives[week];
}
function weeklySuperlativesHtml(lg, week){
  const stored = (lg.weeklySuperlatives && lg.weeklySuperlatives[week]) || [];
  if(!stored.length) return "";
  const cards = stored.map(a=>{
    const def = WEEKLY_SUPERLATIVE_DEFS.find(d=>d.key===a.key);
    if(!def) return "";
    const name = DB.users[a.phone]?.name || "Unknown";
    return `<div class="superlative-card"><div class="superlative-emoji">${def.emoji}</div><div><div class="superlative-title">${esc(def.name)}</div><div class="superlative-winner">${esc(name)}</div><div class="superlative-sub">${esc(a.stat)}</div></div></div>`;
  }).join('');
  return `<div class="superlatives-row">${cards}</div>`;
}

// Finds the single shared weekly deadline (e.g. "Saturday 10:00 AM") for the "fixedWeekly"
// deadline mode, anchored to the Monday of whichever week the earliest game falls in.
function computeFixedWeeklyDeadline(games, dow, timeStr){
  if(!games.length) return null;
  let earliest = games[0];
  games.forEach(g=>{ if(new Date(g.kickoff) < new Date(earliest.kickoff)) earliest = g; });
  const anchor = new Date(earliest.kickoff);
  const monday = new Date(anchor);
  monday.setDate(monday.getDate() - ((anchor.getDay()+6)%7));
  const deadline = new Date(monday);
  deadline.setDate(monday.getDate() + ((dow+6)%7));
  const [hh,mm] = (timeStr||"10:00").split(":").map(Number);
  deadline.setHours(hh,mm,0,0);
  return deadline;
}
function hoursUntilLock(g, lg){
  const mode = lg.settings.deadlineMode || "hoursBeforeEach";
  if(mode==="kickoff") return hoursUntil(g.kickoff);
  if(mode==="fixedWeekly"){
    const games = lg.games[lg.settings.week] || [];
    const dl = computeFixedWeeklyDeadline(games, lg.settings.deadlineDow??6, lg.settings.deadlineTime||"10:00");
    return dl ? (dl.getTime()-nowMs())/36e5 : hoursUntil(g.kickoff);
  }
  return hoursUntil(g.kickoff) - (lg.settings.pickDeadlineHrs??1);
}
function isPickLocked(g, lg){ return hoursUntilLock(g, lg) <= 0; }

function lockPillHtml(g){
  const lg = league();
  const untilLock = hoursUntilLock(g, lg);
  if(untilLock <= 0) return `<span class="lock-pill locked">Locked</span>`;
  if(untilLock <= 6) return `<span class="lock-pill soon">Locks in ${fmtCountdown(untilLock)}</span>`;
  return `<span class="lock-pill">Locks in ${fmtCountdown(untilLock)}</span>`;
}

    // still wait for the real kickoff, not just the pick deadline, so nobody's strategy leaks

    const [leftKey, rightKey] = awayHomeOrder(g);

    let leftCls = "", rightCls = "";

    if(pick===leftKey){ leftCls = cover ? outcomeCls(leftKey) : "selected"; rightCls = "not-chosen"; }
    else if(pick===rightKey){ rightCls = cover ? outcomeCls(rightKey) : "selected"; leftCls = "not-chosen"; }

      ${revealed && locked && !cover ? `<div class="locked-banner">${lockPillHtml(g)} · ${pick? "Your pick: "+esc(pick==='fav'?g.fav.n:g.dog.n) : "No pick made"}</div>` : ''}

function renderLiveTab(){
  const lg = league();
  const commish = isCommish();
  const editMode = commish && COMMISH_MODE;

  // Once a week completes and picking rolls to the next one, keep showing last week's final
  // scores here (instead of the new, empty-looking week) until the new week actually has
  // something to show — its spreads have been revealed, or this user has already picked it.
  let displayWeek = lg.settings.week;
  const curGames = lg.games[displayWeek] || [];
  const myPicksNow = lg.picks[SESSION_PHONE] || {};
  const curActive = curGames.some(g=> spreadVisible(g) || myPicksNow[g.id]);
  if(!editMode && !curActive && displayWeek>1 && weekIsComplete(lg, displayWeek-1)) displayWeek -= 1;

  let games = (lg.games[displayWeek]||[]).slice().sort((a,b)=> new Date(a.kickoff)-new Date(b.kickoff));
  if(!commish){
    const myPicks = lg.picks[SESSION_PHONE] || {};
    games = games.filter(g=> myPicks[g.id]);
  }
  // Live games first (most worth watching), then upcoming, finals sink to the bottom;
  // within each group, kickoff order (already applied above) is preserved.
  const statusRank = {live:0, scheduled:1, final:2};
  games = games.slice().sort((a,b)=> statusRank[a.status] - statusRank[b.status]);
  let html = `<div class="week-header"><h2>Scores</h2><div style="display:flex;align-items:center;gap:10px"><span class="eyebrow">Week ${displayWeek}${displayWeek!==lg.settings.week?' · Final':''}</span>${refreshBtnHtml()}</div></div>`;

  if(commish){
    html += `<div class="commish-mode-toggle ${editMode?'on':''}" onclick="toggleCommishMode()">
      <div><div>Commissioner Mode</div><div class="cm-hint">${editMode? 'Editing on — add / delete / score entry unlocked' : 'Off — viewing the clean scoreboard like everyone else'}</div></div>
      <div class="cm-switch ${editMode?'on':''}"><div class="cm-knob"></div></div>
    </div>`;
  }

  if(editMode){
    const mode = lg.settings.pickMode||'manual';
    if(mode!=='manual'){
      const modeDesc = mode==='favorites' ? 'favorite-team games first, then fills the rest'
        : mode==='top25' ? 'ranked Top 25 matchups first, then fills the rest if there aren\'t enough'
        : `${esc(lg.settings.selectedConference||'your chosen conference')} games first, then fills the rest if there aren't enough`;
      html += `<div class="add-game-card">
        <h3>Auto-Fill Week ${lg.settings.week}</h3>
        <div class="muted" style="margin-bottom:10px">Games fill in automatically — ${modeDesc} toward your ${lg.settings.gamesPerWeek}-game target. Use this button to top back up after a delete, or re-roll for a fresh random mix. Each spread stays hidden as "TBD" (and picks stay locked) until 12:00 AM the Wednesday before that game's kickoff, even if a line is already posted.</div>
        <button class="btn btn-primary" id="genGamesBtn" onclick="regenerateWeekGames()">⚡ Regenerate / Top Up Week ${lg.settings.week}</button>
      </div>`;
    }
    html += `<div class="add-game-card">
      <h3>Add a Game${mode!=='manual'?' Manually':''}</h3>
      <div class="grid2">
        <div class="field" style="margin-bottom:8px"><input id="agFav" list="teamsList" placeholder="Favorite" autocomplete="off"></div>
        <div class="field" style="margin-bottom:8px"><input id="agDog" list="teamsList" placeholder="Underdog" autocomplete="off"></div>
      </div>
      <div class="grid2">
        <div class="field" style="margin-bottom:8px"><input id="agSpread" type="number" step="0.5" placeholder="Spread (optional — blank = TBD)"></div>
        <div class="field" style="margin-bottom:8px"><input id="agKickoff" type="datetime-local"></div>
      </div>
      <div class="error-msg" id="agError"></div>
      <button class="btn btn-outline-accent" onclick="addGame()">Add Game</button>
    </div>`;
  }

  if(games.length===0){
    html += `<div class="empty-hint">${commish? (editMode ? "No games yet — add one above." : "No games posted for this week yet.") : "No live games for your picks this week."}</div>`;
  }

  games.forEach(g=>{
    const cover = computeCover(g);
    const revealed = spreadVisible(g);
    const favSpreadTxt = revealed ? (g.spread<0?g.spread:"+"+g.spread) : "TBD";
    const dogSpreadTxt = revealed ? (g.spread<0?"+"+(-g.spread):(-g.spread)) : "TBD";
    const [leftKey, rightKey] = awayHomeOrder(g);
    const side = {
      fav: {team:g.fav, spreadTxt:favSpreadTxt, home:g.favIsHome===true, score:g.favScore, rank:g.favRank},
      dog: {team:g.dog, spreadTxt:dogSpreadTxt, home:g.favIsHome===false, score:g.dogScore, rank:g.dogRank}
    };
    const L = side[leftKey], R = side[rightKey];
    const myPick = myPicksNow[g.id]; // highlight whichever side is your own pick, so it's obvious at a glance
    // Compact "*ABBR -7.5" line-of-the-day: asterisk marks the home team, spread is relative to them.
    const homeTeam = g.favIsHome===true ? g.fav : g.favIsHome===false ? g.dog : null;
    const homeLine = g.favIsHome===true ? g.spread : g.favIsHome===false ? -g.spread : null;
    const lineTxt = (revealed && homeTeam && homeLine!=null) ? `*${teamAbbr(homeTeam)} ${homeLine<0?homeLine:'+'+homeLine}` : null;
    html += `<div class="ticket ${editMode?'commish-edit':''}">
      <div class="ticket-top">
        <span class="kickoff-txt">${esc(fmtKickoff(g.kickoff))}</span>
        <span style="display:flex;align-items:center;gap:8px">${lineTxt ? `<span class="line-txt">${esc(lineTxt)}</span>` : ''}<span class="status-chip ${g.status}">${g.status}${g.status==='live' && g.periodLabel ? ` · ${esc(g.periodLabel)}` : ''}</span></span>
      </div>
      <div class="matchup">
        <div class="team-side">${teamBadgeHtml(L.team,48)}<div class="team-name${myPick===leftKey?' my-pick':''}">${esc(L.team.n)}${rankTag(L.rank)}</div><div class="team-spread">${L.spreadTxt}</div></div>
        <div class="vs-col"><span class="vs-txt">SCORE</span><span class="score-txt">${L.score??"–"}-${R.score??"–"}</span></div>
        <div class="team-side">${teamBadgeHtml(R.team,48)}<div class="team-name${myPick===rightKey?' my-pick':''}">${esc(R.team.n)}${rankTag(R.rank)}</div><div class="team-spread">${R.spreadTxt}</div></div>
      </div>
      ${!revealed ? `<div class="locked-banner">Spread reveals ${esc(new Date(g.spreadRevealAt).toLocaleString(undefined,{weekday:'short',month:'short',day:'numeric'}))} at 12:00 AM</div>` : ''}
      ${cover ? `<div class="cover-banner ${cover==='push'?'push':''}" style="color:${cover==='push'?'':'var(--ink-dim)'}">${cover==='push' ? 'Push' : (cover==='fav'?esc(g.fav.n):esc(g.dog.n))+' covered'}</div>` : ''}
      ${editMode ? `<div class="commish-panel">
        <div class="row">
          <input type="number" step="0.5" placeholder="${revealed?`Spread (${esc(g.fav.n)} e.g. -6.5)`:'Hidden until Wed reveal — type to force early'}" value="${revealed?(g.spread??''):''}" onchange="updateGameField('${g.id}','spread',this.value)">
        </div>
        <div class="row">
          <input type="number" placeholder="${esc(g.fav.n)} score" value="${g.favScore??''}" onchange="updateGameField('${g.id}','favScore',this.value)">
          <input type="number" placeholder="${esc(g.dog.n)} score" value="${g.dogScore??''}" onchange="updateGameField('${g.id}','dogScore',this.value)">
        </div>
        <div class="status-btns">
          <button class="${g.status==='scheduled'?'active':''}" onclick="updateGameField('${g.id}','status','scheduled')">Scheduled</button>
          <button class="${g.status==='live'?'active':''}" onclick="updateGameField('${g.id}','status','live')">Live</button>
          <button class="${g.status==='final'?'active':''}" onclick="updateGameField('${g.id}','status','final')">Final</button>
        </div>
        <button class="link-btn" style="color:var(--loss);margin-top:6px" onclick="confirmDeleteGame('${g.id}','${esc(g.fav.n)} vs ${esc(g.dog.n)}')">Delete game</button>
      </div>` : ''}
    </div>`;
  });

  $("tabContent").innerHTML = html;
}

function renderBoardTab(){
  const lg = league();
  const viewWeek = LEADERBOARD_VIEWING_WEEK; // null = "Leaderboard" (season standings through today)
  const effectiveWeek = viewWeek ?? lg.settings.week;
  const rows = computeStandings(lg, effectiveWeek);
  const weekOptions = completedWeeks(lg);

  let html = `<div class="week-header">
    <select class="week-select" onchange="setLeaderboardWeek(this.value==='current'?null:parseInt(this.value,10))">
      <option value="current" ${viewWeek==null?'selected':''}>Leaderboard</option>
      ${weekOptions.map(w=>`<option value="${w}" ${viewWeek===w?'selected':''}>Week ${w}</option>`).join('')}
    </select>
    <div style="display:flex;align-items:center;gap:8px">
      ${refreshBtnHtml()}
      <div class="icon-btn" onclick="openSettings()" style="position:relative">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        ${isCommish() && (lg.pendingMembers||[]).length ? `<span style="position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--loss);border:1.5px solid var(--card-bg,#fff)"></span>` : ''}
      </div>
    </div>
  </div>
  <div class="muted" style="margin-bottom:14px">${viewWeek==null ? 'Season standings through today.' : `Standings through the end of Week ${viewWeek}.`}</div>`;
  // Season-long superlatives (the 15-award cascade) aren't wired in here yet — weekly-only for now.

  if(rows.length===0){
    html += `<div class="empty-hint">No standings yet.</div>`;
  } else {
    const top3 = rows.slice(0,3);
    if(top3.length===3){
      const order = [top3[1], top3[0], top3[2]];
      const cls = ["silver","gold","bronze"];
      html += `<div class="podium-row">`;
      order.forEach((r,i)=>{
        html += `<div class="podium-slot ${cls[i]}">
          ${teamBadgeHtml(r.favTeam, 44, r.name, "pav")}
          <div class="pname">${esc(r.name.split(' ')[0])}</div>
          <div class="podium-bar">${r.wins}-${r.losses}</div>
        </div>`;
      });
      html += `</div>`;
    }
    html += rows.map((r,i)=>{
      const me = r.phone===SESSION_PHONE;
      return `<div class="lb-row ${me?'me':''}">
        <div class="lb-rank">${i+1}</div>
        ${teamBadgeHtml(r.favTeam,34,r.name,"lb-fav")}
        <div class="lb-info">
          <div class="lb-name">${esc(r.name)}${me?' (you)':''}${r.paused?' <span style="color:var(--loss);font-weight:800;font-size:10.5px">⏸ PAUSED</span>':''}</div>
          <div class="lb-sub">${esc(r.favTeam?.n||'—')}</div>
        </div>
        <div class="lb-record">
          <div class="lb-pct">${(r.pct*100).toFixed(0)}%</div>
          <div class="lb-wl">${r.wins}-${r.losses}-${r.pushes}</div>
        </div>
      </div>`;
    }).join("");
  }

  // Selecting a specific week embeds that week's recap right at the bottom, in place.
  if(viewWeek!=null){
    const games = (lg.games[viewWeek]||[]).slice().sort((a,b)=> new Date(a.kickoff)-new Date(b.kickoff));
    html += `<div class="recap-inline-divider"><div class="recap-inline-title">Week ${viewWeek} Recap</div>${games.map(g=>recapGameHtml(lg,g)).join('') || `<div class="empty-hint">No games that week.</div>`}</div>`;
  }

  $("tabContent").innerHTML = html;
}

          const isMe = phone===lg.commish;
          const paused = isPausedNow(lg, phone);
          const hasHistory = lg.paused && lg.paused[phone] && lg.paused[phone].length>0;
          return `<div class="settings-list-item" style="cursor:default">
            <span>${esc(mu?.name||'Unknown')}${isMe?' (you)':''}${paused?' <span style="color:var(--loss);font-weight:800;font-size:10.5px">⏸ PAUSED</span>':''}</span>
            ${!isMe ? `<span style="display:flex;gap:8px;align-items:center">
              ${paused
                ? `<button class="link-btn" onclick="unpauseMember('${phone}')">Unpause</button>`
                : `<button class="link-btn" style="color:var(--loss)" onclick="pauseMember('${phone}')">Pause</button>`}
              ${hasHistory ? `<button class="link-btn" style="color:var(--ink-faint)" onclick="confirmClearPause('${phone}','${esc(mu?.name||'')}')">Reset</button>` : ''}
              <button class="link-btn" style="color:var(--ink-faint)" onclick="confirmResetPassword('${phone}','${esc(mu?.name||'')}')">Reset Password</button>
            </span>` : ''}
          </div>`;
        }).join('')}
        <div class="muted" style="margin-top:8px">Pausing marks someone's unfinished weeks as automatic losses (e.g. hasn't paid yet) — fully reversible with Unpause or Reset.</div>
      </div>` : commish ? `<div class="settings-section">
        <h4>League Rules</h4>
        <div class="muted" style="margin-bottom:10px">Turn on Commissioner Mode (Live tab) to edit rules or manage members.</div>
        <div class="settings-list-item" style="cursor:default"><span>Games / Week</span><span>${lg.settings.gamesPerWeek}</span></div>
        <div class="settings-list-item" style="cursor:default"><span>Current Week</span><span>${lg.settings.week}${lg.settings.weekOverride?' (manual)':' (auto)'}</span></div>
        <div class="settings-list-item" style="cursor:default"><span>Pick Deadline</span><span>${esc(deadlineModeLabel(lg))}</span></div>
        <div class="settings-list-item" style="cursor:default"><span>Weekly Game Selection</span><span>${esc(pickModeLabel(lg.settings.pickMode))}${lg.settings.pickMode==='conferences'&&lg.settings.selectedConference?' — '+esc(lg.settings.selectedConference):''}</span></div>
      </div>` : `<div class="settings-section muted">Commissioner: ${esc(DB.users[lg.commish]?.name||'—')}</div>`}

      <div class="settings-section">
        <h4>Notifications</h4>
        <label class="settings-list-item" style="cursor:pointer">
          <span>Push notifications (this device)</span>
          <input type="checkbox" id="notifPushToggle" ${u.notifPrefs?.push?'checked':''} onchange="toggleBrowserPush(this.checked)">
        </label>
        <div class="muted" style="margin:0 0 12px">Free, no setup — alerts you right on this device, e.g. when one of your picked games goes final. Works from your home-screen icon too once installed, not just in a browser tab. Your browser will ask permission the first time.</div>
        <button class="btn btn-outline-accent" onclick="sendTestNotification()">Send Test Notification</button>
      </div>

      <div class="settings-section">
        <h4>Account</h4>
        <div class="settings-list-item" onclick="closeModal();openWeeklyRecap()">Weekly Recap</div>
        <div class="settings-list-item" onclick="closeModal();goToLeagues()">Switch League</div>
        <div class="settings-list-item danger" onclick="closeModal();signOut()">Sign Out</div>
      </div>
    </div></div>`;
}
async function toggleBrowserPush(checked){
  if(checked){
    if(!("Notification" in window)){ showToast("This browser doesn't support notifications."); checked=false; }
    else{
      const perm = await Notification.requestPermission();
      if(perm!=="granted"){ showToast("Notifications blocked — allow them in your browser settings to turn this on."); checked=false; }
    }
  }
  await mutate(draft=>{
    const du = draft.users[SESSION_PHONE];
    du.notifPrefs = du.notifPrefs || {};
    du.notifPrefs.push = checked;
  });
  if(checked) new Notification("The Line", {body:"You're set — we'll notify you here for things like your picked games going final while the app is open."});
  openSettings();
}
// Fires immediately on tap so you can confirm push actually reaches this device (including a
// home-screen-installed PWA) without waiting for a real game to go final.
function sendTestNotification(){
  if(!("Notification" in window)){ showToast("This browser doesn't support notifications."); return; }
  if(Notification.permission!=="granted"){ showToast("Turn on push notifications above first."); return; }
  new Notification("Test notification", {body:"If you're seeing this, push is working on this device."});
  showToast("Test notification sent.");
}

/* =========================================================================
   INIT
   ========================================================================= */
function populateTeamsDatalist(){
  $("teamsList").innerHTML = TEAMS.map(t=>`<option value="${esc(t.n)}">`).join("");
}

function tickCountdowns(){
  if(!$("appScreen").classList.contains("hidden") && (CURRENT_TAB==="picks" || CURRENT_TAB==="board")) render();
}

// Pull-to-refresh: drag down from the top of the screen to force an immediate refresh. There's
// no background polling — data is only fetched on app open or this manual refresh. Uses pointer
// events so it works for touch and mouse. Wired to every screen (sign in/up, leagues list, and
// all three in-league tabs), not just the tabs — each one gets its own appropriate refresh action.
// Explicit refresh button for the header row — same underlying action as pull-to-refresh, just
// a visible, discoverable alternative for anyone who doesn't know about (or can't easily do) the
// drag gesture. The button's own icon spins while the refresh is actually in flight.
async function manualRefresh(btn){
  if(btn) btn.classList.add("spinning");
  try{
    await Promise.all([refreshFromServer(), syncLiveScores(), syncExternalDataSources()]);
  } finally {
    if(btn) btn.classList.remove("spinning");
  }
}
function refreshBtnHtml(){
  return `<button class="icon-btn refresh-btn" onclick="manualRefresh(this)" title="Refresh" style="width:30px;height:30px;color:var(--ink-faint)">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><polyline points="20 4 20 9 15 9"/></svg>
  </button>`;
}
function attachPullToRefresh(el, onRefresh){
  if(!el) return;
  const spinner = $("pullSpinner");
  let startY = null, dragging = false, triggered = false;
  const reset = ()=>{
    dragging = false; startY = null; el.style.transform = "";
    if(spinner){ spinner.classList.remove("visible","spinning"); }
  };
  el.addEventListener("pointerdown", (e)=>{
    if(el.scrollTop>0) return;
    startY = e.clientY; dragging = true; triggered = false;
  });
  el.addEventListener("pointermove", (e)=>{
    if(!dragging || startY==null) return;
    const dy = e.clientY - startY;
    if(dy>0 && el.scrollTop<=0){
      const pull = Math.min(dy*0.4,60);
      el.style.transform = `translateY(${pull}px)`;
      if(spinner) spinner.classList.toggle("visible", dy>16);
      if(dy>140 && !triggered){
        triggered = true;
        if(spinner) spinner.classList.add("spinning");
        // Hold the pulled-down spinner until the refresh actually finishes, not just until
        // the finger lifts — that's the "still reloading" feedback being asked for here.
        Promise.resolve(onRefresh()).finally(reset);
      }
    } else {
      reset();
    }
  });
  el.addEventListener("pointerup", ()=>{ if(!triggered) reset(); });
  el.addEventListener("pointercancel", ()=>{ if(!triggered) reset(); });
  el.addEventListener("pointerleave", ()=>{ if(!triggered) reset(); });
}
function setupPullToRefresh(){
  attachPullToRefresh($("authScreen"), ()=> refreshFromServer());
  attachPullToRefresh($("leaguesScreen"), ()=> refreshFromServer().then(()=>{ if(!$("leaguesScreen").classList.contains("hidden")) renderLeaguesScreen(); }));
  attachPullToRefresh($("tabContent"), ()=> Promise.all([refreshFromServer(), syncLiveScores(), syncExternalDataSources()]));
}

document.addEventListener("DOMContentLoaded", ()=>{
  populateTeamsDatalist();
  initFirebase();
  setupPullToRefresh();
  setInterval(tickCountdowns, 30000);
  setInterval(checkPickReminders, 30000);
  setInterval(checkScheduledRefresh, 30000);
  setInterval(applyScheduledScoring, 30000);
  setInterval(syncExternalDataSources, 30000);
});
</script>
