<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>The Line — Pick'em League</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#0b1a36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Line">
<style>
  :root{
    --navy-950:#060f24;
    --navy-900:#0b1a36;
    --navy-800:#122748;
    --navy-700:#1b3660;
    --navy-650:#20406f;
    --line:#24406e;
    --ink:#eef4fb;
    --ink-dim:#8ea3c7;
    --ink-faint:#5c7099;
    --accent:#57c7ff;
    --accent-dim:rgba(87,199,255,.14);
    --accent-2:#9fe0ff;
    --win:#34d399;
    --loss:#fb7185;
    --push:#fbbf24;
    --gold:#eab308;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(120% 100% at 50% 0%, #0d1f42 0%, var(--navy-950) 55%);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .shell{max-width:480px;margin:0 auto;min-height:100vh;position:relative;display:flex;flex-direction:column;}
  ::selection{background:var(--accent-dim);color:var(--accent-2);}
  a{color:var(--accent);}
  button{font-family:inherit;}
  input,select{font-family:inherit;}
  h1,h2,h3{text-wrap:balance;margin:0;}
  .hidden{display:none !important;}

  /* ---------- generic bits ---------- */
  .eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .field label{font-size:12px;font-weight:700;letter-spacing:.03em;color:var(--ink-dim);text-transform:uppercase;}
  .field input,.field select{
    background:var(--navy-700);border:1px solid var(--line);color:var(--ink);
    border-radius:10px;padding:12px 13px;font-size:15.5px;outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .field input::placeholder{color:var(--ink-faint);}
  .week-select{background:var(--navy-800);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 10px;font-size:17px;font-weight:900;outline:none;}
  .recap-inline-divider{border-top:1px dashed var(--line);margin:20px 0 14px;padding-top:16px;}
  .recap-inline-title{font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:10px;}
  .field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border:none;border-radius:11px;padding:13px 18px;font-size:15px;font-weight:800;
    letter-spacing:.02em;cursor:pointer;width:100%;transition:transform .08s, opacity .15s, background .15s;
  }
  .btn:active{transform:scale(.98);}
  .btn-primary{background:linear-gradient(180deg,var(--accent-2),var(--accent));color:#04101f;box-shadow:0 6px 18px rgba(87,199,255,.28);}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;}
  .btn-ghost{background:var(--navy-700);color:var(--ink);border:1px solid var(--line);}
  .btn-outline-accent{background:transparent;color:var(--accent);border:1.5px solid var(--accent);}
  .btn-danger{background:transparent;color:var(--loss);border:1px solid rgba(251,113,133,.4);}
  .btn-sm{padding:9px 14px;font-size:13px;width:auto;}
  .link-btn{background:none;border:none;color:var(--accent);font-weight:700;cursor:pointer;font-size:14px;padding:4px;}
  .divider{height:1px;background:var(--line);margin:18px 0;}
  .muted{color:var(--ink-dim);font-size:13.5px;line-height:1.5;}
  .error-msg{color:var(--loss);font-size:13px;font-weight:600;min-height:16px;margin-top:-6px;margin-bottom:10px;}

  /* ---------- auth ---------- */
  #authScreen{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 24px;}
  .brand{text-align:center;margin-bottom:34px;}
  .brand-mark{width:72px;height:72px;margin:0 auto 14px;position:relative;}
  .brand h1{font-size:26px;font-weight:900;letter-spacing:-.01em;}
  .brand p{color:var(--ink-dim);font-size:13.5px;margin-top:4px;}
  .authcard{background:var(--navy-800);border:1px solid var(--line);border-radius:18px;padding:24px 22px;}
  .authtabs{display:flex;background:var(--navy-900);border-radius:11px;padding:4px;margin-bottom:22px;}
  .authtab{flex:1;text-align:center;padding:9px;border-radius:8px;font-weight:800;font-size:13.5px;color:var(--ink-dim);cursor:pointer;letter-spacing:.02em;}
  .authtab.active{background:var(--accent);color:#04101f;}
  .team-picker-row{display:flex;align-items:center;gap:10px;background:var(--navy-700);border:1px solid var(--line);border-radius:10px;padding:9px 11px;}
  .team-picker-row img,.team-picker-row .badge-fallback{width:26px;height:26px;flex-shrink:0;}
  .team-picker-row input{flex:1;background:none;border:none;color:var(--ink);font-size:15px;outline:none;padding:3px 0;}

  /* ---------- badges / logos ---------- */
  .badge{border-radius:999px;object-fit:contain;background:#f2f4f8;flex-shrink:0;}
  .badge-fallback{
    border-radius:999px;display:flex;align-items:center;justify-content:center;
    font-weight:900;color:#fff;flex-shrink:0;letter-spacing:-.02em;
  }

  /* ---------- leagues screen ---------- */
  #leaguesScreen{flex:1;padding:22px 20px 40px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
  .topbar .who{font-size:13px;color:var(--ink-dim);}
  .topbar .who b{color:var(--ink);}
  .icon-btn{background:var(--navy-800);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-dim);}
  .icon-btn:disabled{opacity:.3;cursor:default;}
  .icon-btn:hover{color:var(--accent);border-color:var(--accent);}
  .section-title{font-size:19px;font-weight:900;margin-bottom:12px;letter-spacing:-.01em;}
  .league-card{
    background:var(--navy-800);border:1px solid var(--line);border-radius:16px;padding:16px 17px;margin-bottom:12px;
    display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:border-color .15s;
  }
  .league-card:hover{border-color:var(--accent);}
  .league-card .name{font-weight:800;font-size:15.5px;}
  .league-card .meta{color:var(--ink-dim);font-size:12.5px;margin-top:3px;}
  .commish-chip{background:var(--accent-dim);color:var(--accent-2);font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;letter-spacing:.04em;text-transform:uppercase;}
  .empty-hint{color:var(--ink-faint);font-size:13.5px;text-align:center;padding:24px 10px;}
  .cta-row{display:flex;gap:10px;margin-top:18px;}
  .modal-backdrop{position:fixed;inset:0;background:rgba(3,8,20,.65);backdrop-filter:blur(2px);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .modal-backdrop.center{align-items:center;padding:20px;}
  .modal-sheet{
    background:var(--navy-800);border:1px solid var(--line);border-top-left-radius:20px;border-top-right-radius:20px;
    width:100%;max-width:480px;padding:22px 20px 28px;max-height:88vh;overflow-y:auto;
  }
  .modal-backdrop.center .modal-sheet{border-radius:18px;}
  .modal-title{font-size:18px;font-weight:900;margin-bottom:16px;}
  .modal-handle{width:36px;height:4px;background:var(--line);border-radius:99px;margin:0 auto 16px;}

  /* ---------- app shell ---------- */
  #appScreen{flex:1;display:flex;flex-direction:column;padding-bottom:78px;}
  .app-header{
    position:sticky;top:0;z-index:10;background:rgba(11,26,54,.92);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;
  }
  .league-switch{display:flex;align-items:center;gap:8px;cursor:pointer;}
  .league-switch .lname{font-weight:900;font-size:16px;}
  .league-switch svg{color:var(--ink-faint);}
  .user-chip{display:flex;align-items:center;gap:8px;cursor:pointer;}
  .user-chip .uname{color:var(--accent);font-weight:800;font-size:13.5px;}
  .avatar{width:30px;height:30px;border-radius:999px;background:var(--accent-dim);color:var(--accent-2);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12.5px;border:1.5px solid var(--accent);}

  .tab-content{flex:1;padding:18px 18px 10px;transition:transform .2s ease;touch-action:pan-y;}
  .week-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .week-header h2{font-size:20px;font-weight:900;}
  .lock-pill{font-size:11.5px;font-weight:800;padding:5px 10px;border-radius:999px;background:var(--navy-800);border:1px solid var(--line);color:var(--ink-dim);}
  .lock-pill.soon{color:var(--push);border-color:rgba(251,191,36,.4);}
  .lock-pill.locked{color:var(--loss);border-color:rgba(251,113,133,.4);}

  /* ---------- game ticket cards ---------- */
  .ticket{
    background:var(--navy-800);border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden;position:relative;
    transition:border-color .15s, box-shadow .15s;
  }
  .ticket.commish-edit{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset, 0 0 16px rgba(234,179,8,.22);}

  .commish-mode-toggle{
    display:flex;align-items:center;justify-content:space-between;background:var(--navy-800);border:1.5px solid var(--line);
    border-radius:13px;padding:12px 15px;margin-bottom:14px;cursor:pointer;font-weight:800;font-size:13.5px;color:var(--ink-dim);
    transition:border-color .15s, color .15s;
  }
  .commish-mode-toggle.on{border-color:var(--gold);color:var(--gold);box-shadow:0 0 14px rgba(234,179,8,.15);}
  .commish-mode-toggle .cm-hint{font-weight:600;font-size:11px;color:var(--ink-faint);margin-top:2px;}
  .cm-switch{width:42px;height:25px;border-radius:99px;background:var(--navy-700);position:relative;flex-shrink:0;transition:background .15s;}
  .cm-switch .cm-knob{position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:var(--ink-dim);transition:transform .15s, background .15s;}
  .cm-switch.on{background:rgba(234,179,8,.22);}
  .cm-switch.on .cm-knob{transform:translateX(17px);background:var(--gold);}
  .ticket-top{padding:13px 16px 8px;display:flex;align-items:center;justify-content:space-between;}
  .kickoff-txt{font-size:11.5px;color:var(--ink-faint);font-weight:700;letter-spacing:.02em;}
  .line-txt{font-size:11px;color:var(--ink-dim);font-weight:800;letter-spacing:.02em;font-variant-numeric:tabular-nums;}
  .status-chip{font-size:10px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;}
  .status-chip.scheduled{background:var(--navy-700);color:var(--ink-dim);}
  .status-chip.live{background:rgba(251,113,133,.15);color:var(--loss);}
  .status-chip.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:99px;background:var(--loss);margin-right:5px;animation:pulse-dot 1.2s infinite;}
  .status-chip.final{background:rgba(52,211,153,.14);color:var(--win);}
  @keyframes pulse-dot{0%,100%{opacity:1;}50%{opacity:.25;}}
  .matchup{display:flex;align-items:stretch;padding:4px 10px 14px;}
  .team-side{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 8px;}
  .team-side img,.team-side .badge-fallback{width:48px;height:48px;font-size:16px;}
  .team-name{font-size:13px;font-weight:800;text-align:center;line-height:1.2;}
  .team-name.my-pick{color:var(--accent-2);font-weight:900;text-shadow:0 0 10px rgba(159,224,255,.35);}
  .home-tag{font-size:8.5px;font-weight:800;letter-spacing:.04em;color:var(--ink-faint);background:var(--navy-700);border-radius:4px;padding:1px 4px;vertical-align:middle;}
  .rank-tag{font-size:9px;font-weight:800;letter-spacing:.01em;color:var(--ink-faint);vertical-align:super;margin-left:2px;}

  .recap-game{background:var(--navy-800);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;}
  .recap-kickoff{font-size:11px;color:var(--ink-faint);font-weight:700;margin-bottom:10px;}
  .recap-matchup{display:flex;gap:10px;}
  .recap-team{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 6px;border-radius:10px;border:1.5px solid var(--line);}
  .recap-team.recap-cover{background:rgba(52,211,153,.1);border-color:var(--win);}
  .recap-team.recap-nocover{opacity:.5;}
  .recap-team.recap-push{background:rgba(251,191,36,.12);border-color:var(--push);}
  .recap-team-name{font-size:12px;font-weight:800;text-align:center;line-height:1.2;}
  .recap-score{font-size:17px;font-weight:900;font-variant-numeric:tabular-nums;}
  .who-picked-row{display:flex;gap:8px;padding:0 14px 14px;}
  .who-picked-side{flex:1;min-width:0;background:var(--navy-800,var(--navy-700));border:1px solid var(--line);border-radius:10px;padding:6px 6px 8px;text-align:center;}
  .who-picked-label{font-size:10px;color:var(--ink-faint);font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mini-avatar-row{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;min-height:18px;margin-top:2px;}
  .mini-avatar{width:19px;height:19px;border-radius:99px;background:var(--accent-dim);color:var(--accent-2);font-size:8px;font-weight:900;display:flex;align-items:center;justify-content:center;border:1px solid var(--accent);flex-shrink:0;}
  .recap-none{font-size:9px;color:var(--ink-faint);}
  .recap-push-tag{text-align:center;font-size:11px;font-weight:800;color:var(--push);letter-spacing:.03em;margin-top:10px;}
  .superlatives-row{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
  .superlative-card{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,rgba(234,179,8,.12),rgba(87,199,255,.08));border:1px solid var(--gold);border-radius:12px;padding:10px 14px;}
  .superlative-emoji{font-size:26px;flex-shrink:0;}
  .superlative-title{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--gold);}
  .superlative-winner{font-size:15px;font-weight:900;}
  .superlative-sub{font-size:11.5px;color:var(--ink-dim);}
  .team-spread{font-size:11.5px;color:var(--ink-dim);font-weight:700;}
  .vs-col{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0 4px;min-width:46px;}
  .vs-txt{font-size:10.5px;color:var(--ink-faint);font-weight:800;}
  .score-txt{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;}
  .pick-row{display:flex;gap:8px;padding:0 14px 14px;}
  .pick-btn{
    flex:1;min-width:0;background:var(--navy-700);border:1.5px solid var(--line);border-radius:11px;padding:10px 8px;
    display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--ink);
  }
  .pick-btn .pk-name{font-size:12px;font-weight:800;}
  .pick-btn .pk-spread{font-size:11px;color:var(--ink-dim);font-weight:700;}
  .pick-btn.selected{border-color:var(--accent);background:var(--accent-dim);box-shadow:0 0 0 1px var(--accent) inset;}
  .pick-btn.selected .pk-name,.pick-btn.selected .pk-spread{color:var(--accent-2);}
  .pick-btn.disabled{opacity:.55;cursor:default;}
  .pick-btn.not-chosen{opacity:.4;}
  .pick-btn.pick-win{border-color:var(--win);background:rgba(52,211,153,.12);box-shadow:0 0 0 1px var(--win) inset;}
  .pick-btn.pick-win .pk-name,.pick-btn.pick-win .pk-spread{color:var(--win);}
  .pick-btn.pick-loss{border-color:var(--loss);background:rgba(251,113,133,.1);box-shadow:0 0 0 1px var(--loss) inset;}
  .pick-btn.pick-loss .pk-name,.pick-btn.pick-loss .pk-spread{color:var(--loss);}
  .pick-btn.pick-push{border-color:var(--push);box-shadow:0 0 0 1px var(--push) inset;}
  .pick-btn.pick-push .pk-name,.pick-btn.pick-push .pk-spread{color:var(--push);}
  .locked-banner{padding:0 16px 14px;font-size:11.5px;color:var(--ink-faint);font-weight:700;text-align:center;}
  .cover-banner{padding:0 16px 14px;text-align:center;font-size:12.5px;font-weight:800;}
  .cover-banner.win{color:var(--win);}
  .cover-banner.loss{color:var(--loss);}
  .cover-banner.push{color:var(--push);}

  /* commissioner controls inline */
  .commish-panel{background:var(--navy-900);border-top:1px solid var(--line);padding:12px 16px 16px;}
  .commish-panel .row{display:flex;gap:8px;margin-bottom:8px;}
  .commish-panel input{flex:1;min-width:0;width:0;background:var(--navy-700);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:13px;}
  .status-btns{display:flex;gap:6px;}
  .status-btns button{flex:1;min-width:0;font-size:11px;font-weight:800;padding:7px;border-radius:7px;border:1px solid var(--line);background:var(--navy-700);color:var(--ink-dim);cursor:pointer;}
  .status-btns button.active{background:var(--accent);color:#04101f;border-color:var(--accent);}

  .add-game-card{border:1.5px dashed var(--line);border-radius:16px;padding:16px;margin-bottom:14px;background:var(--navy-800);}
  .add-game-card h3{font-size:13.5px;font-weight:800;margin-bottom:12px;color:var(--accent);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid2 > *{min-width:0;}
  .grid2 input{width:100%;}

  /* ---------- leaderboard ---------- */
  .lb-row{display:flex;align-items:center;gap:12px;background:var(--navy-800);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:9px;}
  .lb-row.me{border-color:var(--accent);background:var(--accent-dim);}
  .lb-rank{font-size:15px;font-weight:900;color:var(--ink-faint);width:22px;text-align:center;}
  .lb-row.me .lb-rank{color:var(--accent);}
  .lb-fav{width:34px;height:34px;flex-shrink:0;}
  .lb-info{flex:1;min-width:0;}
  .lb-name{font-weight:800;font-size:14.5px;}
  .lb-row.me .lb-name{color:var(--accent-2);}
  .lb-sub{font-size:11.5px;color:var(--ink-faint);margin-top:1px;}
  .lb-record{text-align:right;}
  .lb-pct{font-weight:900;font-size:15px;font-variant-numeric:tabular-nums;}
  .lb-wl{font-size:11px;color:var(--ink-dim);font-variant-numeric:tabular-nums;}
  .podium-row{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin-bottom:22px;padding:0 6px;}
  .podium-slot{flex:1;text-align:center;display:flex;flex-direction:column;align-items:center;}
  .podium-slot .pav{width:44px;height:44px;border-radius:999px;margin-bottom:8px;}
  .podium-slot .pname{font-size:12px;font-weight:800;margin-bottom:6px;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .podium-bar{width:100%;border-radius:8px 8px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:8px;font-weight:900;font-size:13px;}
  .podium-slot.gold .podium-bar{height:76px;background:linear-gradient(180deg,var(--accent-2),var(--accent));color:#04101f;}
  .podium-slot.silver .podium-bar{height:56px;background:var(--navy-700);border:1px solid var(--line);color:var(--ink);}
  .podium-slot.bronze .podium-bar{height:40px;background:var(--navy-700);border:1px solid var(--line);color:var(--ink-dim);}

  /* ---------- bottom nav ---------- */
  .bottom-nav{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
    background:rgba(11,26,54,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);
    display:flex;padding:8px 14px calc(10px + env(safe-area-inset-bottom));z-index:20;
  }
  .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;color:var(--ink-faint);cursor:pointer;padding:6px 4px;border-radius:12px;position:relative;}
  .nav-btn .nav-label{font-size:10.5px;font-weight:800;letter-spacing:.02em;}
  .nav-btn.active{color:var(--accent);background:var(--accent-dim);}

  /* ---------- global busy indicator ---------- */
  .loading-bar{position:fixed;top:0;left:0;width:100%;height:3px;z-index:200;overflow:hidden;background:transparent;}
  .loading-bar::after{

  .pull-spinner{

/* =========================================================================
   SELF-UPDATE CHECK — there's no service worker here, so a phone that already has this
   page open (or a tab the browser cached) can silently keep running old code indefinitely.
   Bump APP_VERSION on every deploy-ready change; on load, and again whenever the tab comes
   back to the foreground, fetch the live file with no caching and compare its APP_VERSION —
   a mismatch means this tab is stale, so force a real reload (cache-busted URL) rather than
   letting it keep running outdated logic against a live, shared database.
   ========================================================================= */
const APP_VERSION = "v1";
async function checkForUpdate(){
  try{
    const res = await fetch(location.pathname + "?_v=" + Date.now(), {cache:"no-store"});
    const text = await res.text();
    const m = text.match(/const APP_VERSION = "([^"]+)"/);
    if(m && m[1] && m[1]!==APP_VERSION){
      location.href = location.pathname + "?_r=" + Date.now();
    }
  }catch(err){ /* offline or blocked — not worth surfacing, just try again next time */ }
}
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") checkForUpdate(); });
checkForUpdate();

   ========================================================================= */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyByu-AdKqh8O2SQuO_pI8Rvmd2VFyQUMTo",
  authDomain: "the-line-585f3.firebaseapp.com",

};
const DOC_PATH = ["pickem", "league_data"]; // collection, doc id

let fbApp=null, fbDb=null, docRef=null, unsub=null;
let DB = { users:{}, leagues:{} };
let DB_READY = false;

function initFirebase(){
  if(FIREBASE_CONFIG.apiKey === "REPLACE_ME"){
    showToast("⚠️ Firebase not configured yet — see README.md");
    return;
  }
  fbApp = firebase.initializeApp(FIREBASE_CONFIG);
  fbDb = firebase.firestore();
  docRef = fbDb.collection(DOC_PATH[0]).doc(DOC_PATH[1]);
  refreshFromServer();
}

// No live/continuous listener on purpose — this app only pulls fresh data from the server at
// specific moments (app open, a manual refresh, a game's kickoff, or its Wednesday spread
// reveal), not constantly in the background. See checkScheduledRefresh() for the timed triggers.
async function refreshFromServer(){
  if(!docRef) return;
  try{
    const snap = await docRef.get();
    if(!snap.exists){
      await docRef.set({ users:{}, leagues:{} });
      DB = { users:{}, leagues:{} };
    } else {
      DB = snap.data() || { users:{}, leagues:{} };
      DB.users = DB.users || {};
      DB.leagues = DB.leagues || {};
    }
    DB_READY = true;
    onDbUpdate();
  } catch(err){
    console.error(err);
    showToast("Connection error — check Firestore rules");
  }
}

// Every button that saves something (create league, join, pick, pause, etc.) routes through
// here, so a single busy-counter gives the whole app consistent "this is working" feedback
// (a thin bar at the very top of the screen) instead of every button needing its own handling —
// crucial on real mobile connections where a write can visibly take a second or more.
let MUTATE_IN_FLIGHT_COUNT = 0;
function setGlobalBusy(on){
  MUTATE_IN_FLIGHT_COUNT += on ? 1 : -1;
  const bar = $("globalLoadingBar");
  if(bar) bar.classList.toggle("hidden", MUTATE_IN_FLIGHT_COUNT<=0);
}

// Safe read-modify-write. mutator receives a deep-cloned draft of DB and mutates it in place.
// Applies the same write locally right after it lands on the server, so the acting user always
// sees their own action immediately without waiting on any listener or refresh trigger.
async function mutate(mutator){
  if(!docRef) return;
  setGlobalBusy(true);
  let finalDraft = null;
  try{
    await fbDb.runTransaction(async (tx)=>{
      const snap = await tx.get(docRef);
      const draft = snap.exists ? snap.data() : { users:{}, leagues:{} };
      draft.users = draft.users || {};
      draft.leagues = draft.leagues || {};
      mutator(draft);
      tx.set(docRef, draft);
      finalDraft = draft; // captures whichever attempt actually wins, in case Firestore retries this callback
    });
    if(finalDraft){
      DB = finalDraft;
      onDbUpdate();
    }
  } finally {
    setGlobalBusy(false);
  }
}

const CONFERENCE_OF = {};
Object.entries(CONFERENCE_GROUPS).forEach(([conf, teams])=> teams.forEach(t=> CONFERENCE_OF[t]=conf));
const P4_TEAMS = new Set([...CONFERENCE_GROUPS["ACC"], ...CONFERENCE_GROUPS["Big Ten"], ...CONFERENCE_GROUPS["Big 12"], ...CONFERENCE_GROUPS["SEC"]]);
// Brand-name programs outside the Power 4 that still carry real relevance/history — used so the
// random weekly fill reaches for these before ordinary Group of 5 or FCS buy-game matchups.
const MAJOR_NON_P4 = new Set(["Notre Dame","Army","Navy","Air Force","Boise State","Memphis","Tulane","UNLV","Appalachian State","James Madison"]);
// Tiers a fill candidate for priority ordering: 0 = both teams P4, 1 = one team P4,
// 2 = a recognizable non-P4 "major" program, 3 = everything else (the "dog water" tier).
function candidateFillTier(c){
  const favP4 = P4_TEAMS.has(c.fav.n), dogP4 = P4_TEAMS.has(c.dog.n);
  if(favP4 && dogP4) return 0;
  if(favP4 || dogP4) return 1;
  if(MAJOR_NON_P4.has(c.fav.n) || MAJOR_NON_P4.has(c.dog.n)) return 2;
  return 3;
}
// Fills slots tier-by-tier (each tier internally still time-slot-balanced via diversifyByTimeSlot)
// so higher-relevance matchups are always exhausted before falling back to weaker ones.
function fillByTier(pool, slots, weightFn){
  const tiers = [[],[],[],[]];
  pool.forEach(c=> tiers[candidateFillTier(c)].push(c));
  let picked = [];
  for(const tier of tiers){
    if(slots<=0) break;
    const chunk = diversifyByTimeSlot(tier, weightFn).slice(0, slots);
    picked = picked.concat(chunk);
    slots -= chunk.length;
  }
  return picked;
}

// Matches a live ESPN display name (e.g. "Ohio State Buckeyes") back to our curated team entry,
// preferring the longest curated name contained in it (disambiguates e.g. "Miami" vs "Miami (OH)").
function stripDiacritics(s){ return s.normalize("NFD").replace(/[̀-ͯ]/g,""); }
// Requires whole-word boundaries (space or string edge) on both sides of the match, so a
// different school that merely starts with the same word (e.g. "Arkansas-Pine Bluff" vs
// our curated "Arkansas") is correctly rejected instead of misattributed.
const TEAM_NAME_QUALIFIERS = ["western","eastern","northern","southern","north","south","east","west","central","northeast","northeastern","southeast","southeastern","northwest","northwestern","southwest","southwestern"];
// Suffix modifiers that turn a curated name into a different school entirely (e.g. curated
// "North Carolina" must not match "North Carolina A&T", curated "Florida" must not match
// "Florida International" or "Florida A&M") — "state" was the original case; these are the
// same shape of bug for other real-world FCS "buy game" opponents that share a curated name's
// first word(s) but aren't themselves curated (since they're not FBS).
const TEAM_NAME_SUFFIX_REJECT = ["state","a&t","a&m","international","tech"];
function matchLiveTeam(espnDisplayName){
  if(!espnDisplayName) return null;
  const lower = stripDiacritics(espnDisplayName.toLowerCase());
  let best = null;
  for(const t of TEAMS){
    const needle = stripDiacritics(t.n.toLowerCase());
    const idx = lower.indexOf(needle);
    if(idx===-1) continue;
    const before = idx===0 ? " " : lower[idx-1];
    const afterIdx = idx+needle.length;
    const after = afterIdx>=lower.length ? " " : lower[afterIdx];
    if(before!==" " || after!==" ") continue;
    // Reject curated "Illinois" matching inside "Western Illinois ..." (a different school)
    // unless the curated entry itself already starts with that qualifier (e.g. "Western Michigan").
    if(idx>0){
      const prevWord = lower.slice(0, idx).trimEnd().split(/\s+/).pop();
      if(TEAM_NAME_QUALIFIERS.includes(prevWord) && !needle.startsWith(prevWord+" ")) continue;
    }
    // Reject curated "North Carolina" matching "North Carolina A&T ..." (a different school),
    // curated "Illinois" matching "Illinois State ..." etc — unless the curated entry itself IS
    // that longer school (like "Ohio State" or "Texas A&M"), which self-matches fine.
    const afterWord = lower.slice(afterIdx).trimStart().split(/\s+/)[0];
    if(TEAM_NAME_SUFFIX_REJECT.includes(afterWord) && !needle.endsWith(afterWord)) continue;
    if(!best || t.n.length > best.n.length) best = t;
  }
  return best;
}
function shuffleArr(arr){
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}
function seasonYear(){
  const now = new Date();
  return now.getMonth()>=6 ? now.getFullYear() : now.getFullYear()-1; // CFB season runs Aug-Jan
}

// Auto-detects "current week" from ESPN's own season calendar so the commissioner never
// has to type it in manually. Cached per season; falls back gracefully if unreachable.
let SEASON_CALENDAR = null, SEASON_CALENDAR_YEAR = null;
async function ensureSeasonCalendar(year){
  if(SEASON_CALENDAR && SEASON_CALENDAR_YEAR===year) return SEASON_CALENDAR;
  try{
    const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&year=${year}&seasontype=2&week=1&limit=1`);
    const data = await res.json();
    const entries = data.leagues && data.leagues[0] && data.leagues[0].calendar && data.leagues[0].calendar[0] && data.leagues[0].calendar[0].entries;
    if(entries && entries.length){
      SEASON_CALENDAR = entries.map(e=>({week:parseInt(e.value,10), start:new Date(e.startDate), end:new Date(e.endDate)}));
      SEASON_CALENDAR_YEAR = year;
    }
  }catch(err){ console.error("season calendar fetch failed", err); }
  return SEASON_CALENDAR;
}
function detectCurrentWeekSync(){
  if(!SEASON_CALENDAR || !SEASON_CALENDAR.length) return null;
  const now = new Date();
  for(const w of SEASON_CALENDAR){ if(now>=w.start && now<w.end) return w.week; }
  if(now < SEASON_CALENDAR[0].start) return 1;
  return SEASON_CALENDAR[SEASON_CALENDAR.length-1].week;
}
async function autoDetectWeek(){
  await ensureSeasonCalendar(seasonYear());
  return detectCurrentWeekSync();
}
let WEEK_SYNCED_FOR = null;
async function syncAutoWeek(){
  const lg = league();
  if(!lg || lg.settings.weekOverride) return;
  if(WEEK_SYNCED_FOR===CURRENT_LEAGUE) return;
  WEEK_SYNCED_FOR = CURRENT_LEAGUE;
  const wk = await autoDetectWeek();
  // Never move backward — once a week has advanced (whether by this calendar check earlier, or by
  // the completed-week auto-advance in maybeShowWeeklyRecap), a stale/preseason calendar read must
  // not yank everyone's active picking week back down.
  if(wk && wk!==lg.settings.week && wk>lg.settings.week){
    await mutate(draft=>{ draft.leagues[CURRENT_LEAGUE].settings.week = wk; });
  }
}
async function enableWeekOverride(){
  await mutate(draft=>{ draft.leagues[CURRENT_LEAGUE].settings.weekOverride = true; });
  openSettings();
}
async function disableWeekOverride(){
  await mutate(draft=>{ draft.leagues[CURRENT_LEAGUE].settings.weekOverride = false; });
  WEEK_SYNCED_FOR = null;
  await syncAutoWeek();
  openSettings();
}

const $ = id => document.getElementById(id);
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function normPhone(p){
  let d = (p||"").replace(/\D/g,"");
  if(d.length===11 && d[0]==="1") d = d.slice(1); // treat +1 country code as equivalent to the bare 10-digit number
  return d;
}
function formatPhoneDisplay(raw){
  let d = (raw||"").replace(/\D/g,"");
  let prefix = "";
  if(d.length>10 && d[0]==="1"){ prefix = "+1 "; d = d.slice(1); }
  d = d.slice(0,10);
  if(d.length===0) return "";
  if(d.length<4) return prefix+`(${d}`;
  if(d.length<7) return prefix+`(${d.slice(0,3)}) ${d.slice(3)}`;
  return prefix+`(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
}
function onPhoneInput(el){
  const pos = el.selectionStart;
  const before = el.value.length;
  el.value = formatPhoneDisplay(el.value);
  const after = el.value.length;
  const newPos = Math.max(0, pos + (after-before));
  el.setSelectionRange(newPos, newPos);
}
function initials(name){
  if(!name) return "?";
  const parts = name.trim().split(/\s+/);
  return ((parts[0]?.[0]||"") + (parts[1]?.[0]||"")).toUpperCase() || name[0].toUpperCase();
}
function colorFromString(str){
  let h=0; for(let i=0;i<str.length;i++) h = str.charCodeAt(i) + ((h<<5)-h);
  const hue = Math.abs(h)%360;
  return `hsl(${hue} 55% 42%)`;
}
async function sha256(text){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
function genLeagueCode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let out = "";
  for(let i=0;i<6;i++) out += chars[Math.floor(Math.random()*chars.length)];
  return out;
}
function genGameId(){ return "g" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function showToast(msg, ms=2600){
  const root = $("toastRoot");
  root.innerHTML = `<div class="toast">${esc(msg)}</div>`;
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> root.innerHTML="", ms);
}
function teamBadgeHtml(team, size, fallbackName, extraClass){
  const nm = team?.n || fallbackName || "?";
  const bg = team?.c ? "#"+team.c : colorFromString(nm);
  const cls = extraClass ? " "+extraClass : "";
  if(team?.l){
    return `<img class="badge${cls}" data-name="${esc(nm)}" data-color="${esc(bg)}" data-size="${size}" src="${team.l}" width="${size}" height="${size}" style="width:${size}px;height:${size}px" alt="${esc(nm)}" onerror="handleBadgeError(this)">`;
  }
  return `<div class="badge-fallback${cls}" style="width:${size}px;height:${size}px;background:${bg};font-size:${Math.round(size*0.34)}px">${esc(initials(nm))}</div>`;
}
function handleBadgeError(img){
  const name = img.dataset.name || "?";
  const color = img.dataset.color || colorFromString(name);
  const size = parseInt(img.dataset.size,10) || 32;
  const div = document.createElement("div");
  div.className = img.className.replace("badge","badge-fallback");
  div.style.cssText = `width:${size}px;height:${size}px;background:${color};font-size:${Math.round(size*0.34)}px`;
  div.textContent = initials(name);
  img.replaceWith(div);
}
function fmtKickoff(iso){
  const d = new Date(iso);
  if(isNaN(d)) return "TBD";
  const opts = {weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit"};
  return d.toLocaleString(undefined, opts);
}
// Testing-only clock override so we can fast-forward "now" without waiting for real time to
// pass (e.g. to preview Wednesday's spread reveal or a Saturday noon lock). Unused in real
// production use — nowMs() just falls through to the real clock unless MOCK_NOW is set.
let MOCK_NOW = null;
function nowMs(){ return MOCK_NOW!==null ? MOCK_NOW : Date.now(); }
function hoursUntil(iso){ return (new Date(iso).getTime() - nowMs()) / 36e5; }
function fmtCountdown(hrs){
  if(hrs<=0) return "now";
  if(hrs<1) return Math.round(hrs*60)+"m";
  if(hrs<48) return Math.round(hrs)+"h";
  return Math.round(hrs/24)+"d";
}

async function createLeague(){
  const name = $("clName").value.trim();
  const err = $("clError");
  err.textContent = "";
  const gpw = parseInt($("stGamesPerWeek").value,10);
  const pickMode = $("stPickMode").value;
  const deadlineMode = $("stDeadlineMode").value;
  if(!name) return err.textContent = "Give your league a name.";
  if(isNaN(gpw) || gpw<1) return err.textContent = "Enter how many games per week.";
  if(!pickMode) return err.textContent = "Choose a weekly game selection mode.";
  if(!deadlineMode) return err.textContent = "Choose a pick deadline.";

  let selectedConference = null;
  if(pickMode==="conferences"){
    selectedConference = $("stConference") ? $("stConference").value : "";
    if(!selectedConference) return err.textContent = "Choose a conference.";
  }
  let pickDeadlineHrs = 1, deadlineDow = 6, deadlineTime = "10:00";
  if(deadlineMode==="hoursBeforeEach"){
    pickDeadlineHrs = parseFloat($("stPickDeadline").value);
    if(isNaN(pickDeadlineHrs)) return err.textContent = "Enter how many hours before kickoff picks should lock.";
  } else if(deadlineMode==="fixedWeekly"){
    deadlineDow = parseInt($("stDeadlineDow").value,10);
    deadlineTime = $("stDeadlineTime").value;
    if(isNaN(deadlineDow) || !deadlineTime) return err.textContent = "Pick a day and time for the weekly deadline.";
  }

  const code = genLeagueCode();
  const phone = SESSION_PHONE;
  await mutate(draft=>{
    draft.leagues[code] = {
      code, name, commish: phone, createdAt: Date.now(),
      settings: {
        gamesPerWeek: gpw, week: 1, weekOverride: false,
        pickMode, selectedConference: selectedConference || null, // Firestore rejects `undefined`, unlike plain JS objects
        deadlineMode, pickDeadlineHrs, deadlineDow, deadlineTime
      },
      members: [phone],
      pendingMembers: [],
      games: {}, picks: {}, paused: {}
    };
    draft.users[phone].leagues = draft.users[phone].leagues || [];
    if(!draft.users[phone].leagues.includes(code)) draft.users[phone].leagues.push(code);
  });
  closeModal();
  showToast(`League "${name}" created — code ${code}`);
  enterLeague(code);
}

function computeCover(g){
  if(g.status!=="final" || g.favScore==null || g.dogScore==null || g.spread==null) return null;
  const diff = g.favScore - g.dogScore;
  const line = -g.spread; // g.spread is stored negative (e.g. -7); the favorite must win by more than this to cover
  if(diff > line) return "fav";
  if(diff < line) return "dog";
  return "push";
}
// A spread is visible once we've both fetched a real line AND passed that game's own
// Wednesday-before-kickoff reveal time — games with no posted line yet (e.g. buy games
// against lower-division opponents) simply stay "TBD" until a line exists.
function spreadVisible(g){
  if(g.spread==null) return false;
  if(!g.spreadRevealAt) return true; // manually-added games have no reveal gate
  return nowMs() >= new Date(g.spreadRevealAt).getTime();
}
// Returns ['fav','dog'] or ['dog','fav'] — whichever puts the real away team on the left and
// the real home team on the right, matching "Away @ Home" convention. Falls back to fav-left
// when home/away isn't known (manually-added games have no favIsHome data).
function awayHomeOrder(g){
  return g.favIsHome===true ? ['dog','fav'] : ['fav','dog'];
}

// Finds the "primary" game day for a week's slate (almost always Saturday) using the actual
// fetched events, then walks back to that same week's Wednesday at local midnight.
// Per-game reveal gate: the Wednesday at local midnight preceding THAT game's own kickoff.
function computeSpreadRevealTime(kickoffISO){
  const k = new Date(kickoffISO);
  const lock = new Date(k);
  const diffToWed = (lock.getDay() - 3 + 7) % 7; // days since the preceding Wednesday
  lock.setDate(lock.getDate() - diffToWed);
  lock.setHours(0,0,0,0);
  return lock.toISOString();
}

// Buckets a kickoff into the major CFB broadcast windows (Eastern time), so fill logic can
// spread picks across them instead of clumping into one slot (e.g. five 3:30pm games). This
// balancing is always-on and isn't something the commissioner configures.
function timeSlotOf(kickoffISO){
  const d = new Date(kickoffISO);
  const parts = new Intl.DateTimeFormat("en-US", {timeZone:"America/New_York", hour:"numeric", hour12:false, weekday:"short"}).formatToParts(d);
  let hour = parseInt(parts.find(p=>p.type==="hour").value, 10);
  if(hour===24) hour = 0;
  const weekday = parts.find(p=>p.type==="weekday").value;
  if(weekday!=="Sat"){
    if(weekday==="Thu" || weekday==="Fri") return "Friday Night";
    return "Other";
  }
  if(hour>=11 && hour<14) return "Saturday Noon";
  if(hour>=14 && hour<18) return "Saturday Afternoon";
  if(hour>=18) return "Saturday Primetime";
  return "Other";
}

// True weighted-random draw without replacement — a higher weight makes a candidate MUCH more
// likely to come out early, but never guarantees it. weightFn null means every candidate is
// equally likely (pure random).
function weightedShuffle(arr, weightFn){
  const pool = arr.map(item=>({item, weight: weightFn ? Math.max(0.0001, weightFn(item)) : 1}));
  const out = [];
  while(pool.length){
    const total = pool.reduce((s,p)=>s+p.weight, 0);
    let r = Math.random()*total, idx = 0;
    for(; idx<pool.length; idx++){ r -= pool[idx].weight; if(r<=0) break; }
    if(idx>=pool.length) idx = pool.length-1;
    out.push(pool[idx].item);
    pool.splice(idx,1);
  }
  return out;
}

// Buckets candidates by time slot, weighted-shuffles each bucket (a preference skews the odds,
// it doesn't force an order), then round-robins across buckets so slots stay balanced overall.
function diversifyByTimeSlot(list, weightFn){
  const bySlot = {};
  list.forEach(c=>{ const slot = timeSlotOf(c.kickoff); (bySlot[slot]=bySlot[slot]||[]).push(c); });
  Object.keys(bySlot).forEach(k=>{ bySlot[k] = weightedShuffle(bySlot[k], weightFn); });
  const slotKeys = shuffleArr(Object.keys(bySlot));
  const out = [];
  let round = 0, guard = 0;
  while(out.length < list.length && guard < 1000){
    let added = false;
    for(const slot of slotKeys){
      const arr = bySlot[slot];
      if(arr[round]){ out.push(arr[round]); added = true; }
    }
    round++; guard++;
    if(!added) break;
  }
  return out;
}

// Weight functions for the commissioner's optional "Ranked Game Preference" — a match gets a
// much higher chance of being picked, but a non-match is still possible, just far less likely.
const RANK_PREF_BOOST = 6;
function rankPrefWeightFn(pref){
  if(pref==="top25Both") return c => (c.favRank<=25 && c.dogRank<=25) ? RANK_PREF_BOOST : 1;
  if(pref==="top25Either") return c => (c.favRank<=25 || c.dogRank<=25) ? RANK_PREF_BOOST : 1;
  if(pref==="top10Single") return c => (c.favRank<=10 || c.dogRank<=10) ? RANK_PREF_BOOST : 1;
  return null;
}

// The "Regenerate / Top Up" button: clears out any game that's still just "scheduled" AND has
// no picks from anyone yet, then lets generateWeekGames() fill back up to target with a fresh
// random draw (still respecting favorites, ranked preference, and time-slot balance). Anything
// live, final, or already picked is left alone — re-rolling never invalidates a real pick.
// Builds a normalized game candidate from one ESPN event, or null if the event is unusable.
// Shared by the full-week generator and the single-team lookup used when a new member joins.
// The scoreboard's own embedded curatedRank field only fills in once games are close (games
// weeks out come back unranked even for a top-5 team), but ESPN publishes the actual poll
// separately well before that — cached here and used as the fallback rank source.
let RANK_BY_TEAM = null;
async function ensureRankings(){
  if(RANK_BY_TEAM) return RANK_BY_TEAM;
  RANK_BY_TEAM = {};
  try{
    const res = await fetch("https://site.api.espn.com/apis/site/v2/sports/football/college-football/rankings");
    const data = await res.json();
    const poll = data.rankings && data.rankings.find(p=> /playoff|ap top|coaches/i.test(p.name||"")) || (data.rankings && data.rankings[0]);
    (poll && poll.ranks || []).forEach(r=>{
      const t = findTeam(r.team.location) || matchLiveTeam(`${r.team.location} ${r.team.name}`);
      if(t && !(t.n in RANK_BY_TEAM)) RANK_BY_TEAM[t.n] = r.current;
    });
  }catch(err){ console.error("rankings fetch failed", err); }
  return RANK_BY_TEAM;
}

function buildCandidateFromEvent(ev){
  const comp = ev.competitions && ev.competitions[0];
  const home = comp && comp.competitors.find(c=>c.homeAway==="home");
  const away = comp && comp.competitors.find(c=>c.homeAway==="away");
  if(!comp || !home || !away) return null;
  const odds = comp.odds && comp.odds[0];
  const hasOdds = !!(odds && typeof odds.spread === "number");
  const homeIsFav = hasOdds ? !!(odds.homeTeamOdds && odds.homeTeamOdds.favorite) : true; // no line yet: home shown as placeholder favorite
  const favC = homeIsFav ? home : away;
  const dogC = homeIsFav ? away : home;
  const favTeam = matchLiveTeam(favC.team.displayName);
  const dogTeam = matchLiveTeam(dogC.team.displayName);
  const favEntry = favTeam ? {n:favTeam.n,l:favTeam.l,c:favTeam.c} : {n:favC.team.displayName,l:(favC.team.logo||null),c:null};
  const dogEntry = dogTeam ? {n:dogTeam.n,l:dogTeam.l,c:dogTeam.c} : {n:dogC.team.displayName,l:(dogC.team.logo||null),c:null};
  const kickoff = new Date(comp.date).toISOString();
  const rankByTeam = RANK_BY_TEAM || {};
  const favRank = (favC.curatedRank && favC.curatedRank.current) || (favTeam && rankByTeam[favTeam.n]) || 99;
  const dogRank = (dogC.curatedRank && dogC.curatedRank.current) || (dogTeam && rankByTeam[dogTeam.n]) || 99;
  // No real line posted yet (common for games more than a week or two out) — make one up rather
  // than leaving picks stuck on "TBD". Skews toward small-to-medium spreads, since blowout lines
  // are rarer than close ones; a real line just overwrites this the next time games are topped up.
  const fakeSpread = -(3 + Math.round(Math.pow(Math.random(),1.6)*32*2)/2);
  return {
    key: favEntry.n+"@"+dogEntry.n, fav:favEntry, dog:dogEntry,
    spread: hasOdds ? -Math.abs(odds.spread) : fakeSpread,
    kickoff, spreadRevealAt: computeSpreadRevealTime(kickoff),
    espnId: ev.id, favIsHome: homeIsFav,
    rankHit: favRank<=25 || dogRank<=25, favRank, dogRank,
    conf: CONFERENCE_OF[favEntry.n] || CONFERENCE_OF[dogEntry.n] || "Other"
  };
}

// NFL counterpart to buildCandidateFromEvent — no curated logo/color data or conference/rank
// concepts, just the real matchup, real line (when posted), and real kickoff.
function buildNflCandidateFromEvent(ev){
  const comp = ev.competitions && ev.competitions[0];
  const home = comp && comp.competitors.find(c=>c.homeAway==="home");
  const away = comp && comp.competitors.find(c=>c.homeAway==="away");
  if(!comp || !home || !away) return null;
  const odds = comp.odds && comp.odds[0];
  const hasOdds = !!(odds && typeof odds.spread === "number");
  const homeIsFav = hasOdds ? !!(odds.homeTeamOdds && odds.homeTeamOdds.favorite) : true;
  const favC = homeIsFav ? home : away;
  const dogC = homeIsFav ? away : home;
  const favEntry = {n:favC.team.displayName, l:null, c:null};
  const dogEntry = {n:dogC.team.displayName, l:null, c:null};
  const kickoff = new Date(comp.date).toISOString();
  return {
    key: favEntry.n+"@"+dogEntry.n, fav:favEntry, dog:dogEntry,
    spread: hasOdds ? -Math.abs(odds.spread) : null,
    kickoff, spreadRevealAt: computeSpreadRevealTime(kickoff),
    espnId: ev.id, favIsHome: homeIsFav,
    rankHit: false, favRank: null, dogRank: null, conf: "NFL"
  };
}

// A member's favorite team for a given league — NFL leagues keep their own per-league favorite
// (sign-up only collects a CFB team), while CFB leagues use the team chosen at sign-up.
function favTeamNameFor(lg, phone){
  if((lg.settings.sport||"cfb")==="nfl"){
    return (lg.favTeams && lg.favTeams[phone] && lg.favTeams[phone].n) || null;
  }
  const u = DB.users[phone];
  return (u && u.favTeam && u.favTeam.n) || null;
}

// When a new member joins a league running Favorite Teams mode, quietly check whether their
// team is already playing this week and, if there's room, add just that one game — no full
// regenerate, no reshuffling anything else. If their team isn't found playing, games are left
// exactly as they were.
async function maybeAddNewMemberFavoriteGame(code, phone){
  const lg = DB.leagues[code];
  if(!lg || (lg.settings.pickMode||"manual")!=="favorites") return;
  const wk = lg.settings.week;
  const existing = lg.games[wk] || [];
  const teamName = favTeamNameFor(lg, phone);
  if(!teamName) return;
  if(existing.some(g=> g.fav.n===teamName || g.dog.n===teamName)) return; // already in the slate
  if(existing.length >= lg.settings.gamesPerWeek) return; // no room — keep games the same

  try{
    const sport = lg.settings.sport || "cfb";
    if(sport!=="nfl") await ensureRankings();
    const espnWk = (sport==="nfl" && lg.settings.nflWeekMap && lg.settings.nflWeekMap[wk]) || wk;
    const url = sport==="nfl"
      ? `https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?seasontype=1&week=${espnWk}&limit=50`
      : `https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&year=${seasonYear()}&seasontype=2&week=${wk}&limit=200`;
    const res = await fetch(url);
    if(!res.ok) return;
    const data = await res.json();
    for(const ev of (data.events||[])){
      const c = sport==="nfl" ? buildNflCandidateFromEvent(ev) : buildCandidateFromEvent(ev);
      if(!c || (c.fav.n!==teamName && c.dog.n!==teamName)) continue;
      await mutate(draft=>{
        const dl = draft.leagues[code];
        dl.games[wk] = dl.games[wk] || [];
        if(dl.games[wk].length >= dl.settings.gamesPerWeek) return;
        if(dl.games[wk].some(g=> g.fav.n+"@"+g.dog.n===c.key)) return;
        dl.games[wk].push({ id: genGameId(), fav:c.fav, dog:c.dog, spread:c.spread, spreadRevealAt:c.spreadRevealAt, kickoff:c.kickoff, status:"scheduled", favScore:null, dogScore:null, espnId:c.espnId, favIsHome:c.favIsHome, favRank:c.favRank, dogRank:c.dogRank });
      });
      render();
      showToast(`${teamName} is playing this week — added their game.`);
      return;
    }
    // their team isn't playing this week (or couldn't be matched) — games are left unchanged
  }catch(err){
    console.error("auto-add on join failed", err);
  }
}

async function regenerateWeekGames(){
  const lg = league();
  const wk = lg.settings.week;
  const isLocked = g => g.status!=="scheduled" || Object.values(lg.picks||{}).some(p=>p && p[g.id]);
  const all = lg.games[wk] || [];
  const removable = all.filter(g=>!isLocked(g));
  if(all.length>0 && removable.length===0){
    showToast("Nothing to re-roll — every game is live/final or already has a pick on it.");
    return;
  }
  await mutate(draft=>{
    const dl = draft.leagues[CURRENT_LEAGUE];
    dl.games[wk] = (dl.games[wk]||[]).filter(isLocked);
  });
  render();
  await generateWeekGames();
}

let GENERATE_IN_FLIGHT = false;
async function generateWeekGames(){
  const lg = league();
  const wk = lg.settings.week;
  const mode = lg.settings.pickMode || "manual";
  if(mode==="manual") return;
  if(GENERATE_IN_FLIGHT) return; // guards against overlapping triggers (auto-generate, delete-refill, a fast double-click) racing each other
  GENERATE_IN_FLIGHT = true;
  const target = lg.settings.gamesPerWeek;
  const existing = (lg.games[wk] || []);
  const btn = $("genGamesBtn");
  if(btn){ btn.disabled = true; btn.textContent = "Fetching live matchups…"; }
  try{
    const sport = lg.settings.sport || "cfb";
    if(sport!=="nfl") await ensureRankings();
    const espnWk = (sport==="nfl" && lg.settings.nflWeekMap && lg.settings.nflWeekMap[wk]) || wk;
    const url = sport==="nfl"
      ? `https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?seasontype=1&week=${espnWk}&limit=50`
      : `https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&year=${seasonYear()}&seasontype=2&week=${wk}&limit=200`;
    const res = await fetch(url);
    if(!res.ok) throw new Error("bad response");
    const data = await res.json();
    const events = data.events || [];

    const seenKeys = new Set(existing.map(g=> g.fav.n+"@"+g.dog.n));
    const candidates = [];
    events.forEach(ev=>{
      const c = sport==="nfl" ? buildNflCandidateFromEvent(ev) : buildCandidateFromEvent(ev);
      if(!c || seenKeys.has(c.key)) return;
      seenKeys.add(c.key);
      candidates.push(c);
    });
    // Games with no posted line yet are never excluded — they're still added, just shown as
    // "TBD" until a real spread appears (and stay hidden behind the Wednesday reveal either way).

    let slots = Math.max(0, target - existing.length);
    const slotsNeeded = slots;
    let chosen = [];
    let favCount = 0;

    if(mode==="favorites"){
      const favTeamNames = new Set(lg.members.map(p=> favTeamNameFor(lg, p)).filter(Boolean));
      const isFavHit = c => favTeamNames.has(c.fav.n) || favTeamNames.has(c.dog.n);
      const favPicks = candidates.filter(isFavHit);
      const restPool = candidates.filter(c=> !isFavHit(c));
      shuffleArr(favPicks);
      chosen = favPicks.slice(0, slots);
      slots -= chosen.length;
      // Fill always exhausts Big Ten/SEC/ACC/Big 12 matchups first, then other recognizable
      // "major" programs (Notre Dame, service academies, etc.), and only reaches for ordinary
      // Group of 5 / FCS buy games once those tiers are used up. Still time-slot-balanced and,
      // within a tier, an optional ranked-game preference skews the odds toward ranked matches.
      if(slots>0){
        const weightFn = rankPrefWeightFn(lg.settings.favoritesRankPref);
        chosen = chosen.concat(fillByTier(restPool, slots, weightFn));
      }
      favCount = chosen.filter(isFavHit).length;
    } else if(mode==="top25"){
      const ranked = candidates.filter(c=>c.rankHit);
      const other = candidates.filter(c=>!c.rankHit);
      shuffleArr(ranked);
      chosen = ranked.slice(0, slots);
      slots -= chosen.length;
      if(slots>0){ shuffleArr(other); chosen = chosen.concat(other.slice(0, slots)); }
    } else if(mode==="conferences"){
      const targetConf = lg.settings.selectedConference || Object.keys(CONFERENCE_GROUPS)[0];
      const favTeamNames = new Set(lg.members.map(p=> favTeamNameFor(lg, p)).filter(Boolean));
      const isFavHit = c => favTeamNames.has(c.fav.n) || favTeamNames.has(c.dog.n);
      const inConf = candidates.filter(c=> c.conf===targetConf);
      // A member's favorite team playing in the chosen conference is always guaranteed a spot.
      const favInConf = inConf.filter(isFavHit);
      const restInConf = inConf.filter(c=> !isFavHit(c));
      shuffleArr(favInConf);
      chosen = favInConf.slice(0, slots);
      slots -= chosen.length;
      if(slots>0){ chosen = chosen.concat(diversifyByTimeSlot(restInConf, null).slice(0, slots)); } // conference-only: no fallback to other conferences, even if under target
      favCount = chosen.filter(isFavHit).length;
    }

    if(chosen.length===0){
      showToast(mode==="top25" ? "No ranked matchups found for this week yet."
        : mode==="conferences" ? `No live ${lg.settings.selectedConference||'conference'} games found for this week yet.`
        : "No new live matchups found to add — try adding manually.");
      return;
    }

    await mutate(draft=>{
      const dl = draft.leagues[CURRENT_LEAGUE];
      dl.games[wk] = dl.games[wk] || [];
      chosen.forEach(c=>{
        dl.games[wk].push({ id: genGameId(), fav:c.fav, dog:c.dog, spread:c.spread, spreadRevealAt:c.spreadRevealAt, kickoff:c.kickoff, status:"scheduled", favScore:null, dogScore:null, espnId:c.espnId, favIsHome:c.favIsHome, favRank:c.favRank, dogRank:c.dogRank });
      });
    });
    const modeNote = mode==="top25" ? " (ranked matchups)"
      : mode==="conferences" ? ` — all ${lg.settings.selectedConference||'conference'}${favCount?` (${favCount} from favorite teams)`:''}${chosen.length<slotsNeeded?` (only ${chosen.length} available, short of your ${target} target)`:''}`
      : ` (${favCount} from favorite teams)`;
    showToast(`Added ${chosen.length} game${chosen.length===1?"":"s"}${modeNote}.`);
    render();
  }catch(err){
    console.error(err);
    showToast("Couldn't reach ESPN for live matchups — check your connection or add games manually.");
  }finally{
    GENERATE_IN_FLIGHT = false;
    if(btn){ btn.disabled=false; btn.textContent = "⚡ Regenerate / Top Up Week "+wk; }
  }
}

async function updateGameField(gameId, field, value){
  await mutate(draft=>{
    const dl = draft.leagues[CURRENT_LEAGUE];
    const wk = dl.settings.week;
    const g = (dl.games[wk]||[]).find(x=>x.id===gameId);
    if(!g) return;
    if(field==="favScore" || field==="dogScore"){
      g[field] = value==="" ? null : parseInt(value,10);
    } else if(field==="status"){
      g.status = value;
    } else if(field==="spread"){
      g.spread = value==="" ? null : parseFloat(value);
      g.spreadRevealAt = null; // a commissioner-set spread is visible immediately
    }
  });
}

// Auto-updates scores/status for games that were pulled in via Auto-Fill (they carry a
// stored ESPN event id). Manually-added games have no espnId and are left for the
// commissioner to update by hand, since there's no reliable way to match them live.
let SYNC_IN_FLIGHT = false;
function notifyFinalizedPicks(week, gameIds){
  if(!gameIds.length) return;
  const u = currentUser();
  if(!u || !u.notifPrefs || !u.notifPrefs.push) return;
  if(!("Notification" in window) || Notification.permission!=="granted") return;
  const lg = league();
  if(!lg) return;
  const myPicks = lg.picks[SESSION_PHONE] || {};
  gameIds.forEach(gid=>{
    const pick = myPicks[gid];
    if(!pick) return; // only notify for games this user actually picked
    const g = (lg.games[week]||[]).find(x=>x.id===gid);
    if(!g) return;
    const cover = computeCover(g);
    if(!cover) return;
    const result = cover==="push" ? "Push — no cover" : (pick===cover ? "You covered ✓" : "No cover");
    new Notification("Game final", {body:`${g.fav.n} ${g.favScore}-${g.dogScore} ${g.dog.n} — ${result}`});
  });
}
// No background polling of the server — a fresh docRef.get() only happens on app open, a
// manual pull-to-refresh, or when a game in the current week crosses one of two moments that
// actually change what's on screen for everyone: its Wednesday spread reveal, or its kickoff
// (which locks picks and starts live scoring). This timer just watches for those two crossings.
const REFRESH_FIRED = new Set();
function checkScheduledRefresh(){
  if(!DB_READY || !CURRENT_LEAGUE) return;
  const lg = league();
  if(!lg) return;
  const games = lg.games[lg.settings.week] || [];
  games.forEach(g=>{
    if(g.spreadRevealAt && nowMs() >= new Date(g.spreadRevealAt).getTime()){
      const key = g.id+":reveal";
      if(!REFRESH_FIRED.has(key)){ REFRESH_FIRED.add(key); refreshFromServer(); }
    }
    if(nowMs() >= new Date(g.kickoff).getTime()){
      const key = g.id+":kickoff";
      if(!REFRESH_FIRED.has(key)){ REFRESH_FIRED.add(key); refreshFromServer(); }
    }
  });
}

// Predetermined score simulation. A game can carry a `scoreTimeline` — a fixed schedule of
// {min, fav, dog, period, status?} checkpoints, where `min` is minutes-since-kickoff. Instead of
// anyone having to be present to push updates at the right real moment, every open client just
// computes "what's actually true right now" from real elapsed time and syncs the game to match.
// Same result no matter who's looking or when — that's what keeps every viewer showing identical
// scores at identical moments, without any manual pushing.
function computeTimelineState(g){
  if(!g.scoreTimeline || !g.scoreTimeline.length) return null;
  const elapsedMin = (nowMs() - new Date(g.kickoff).getTime()) / 60000;
  if(elapsedMin < 0) return null; // hasn't kicked off yet
  let applicable = g.scoreTimeline[0];
  for(const cp of g.scoreTimeline){
    if(cp.min <= elapsedMin) applicable = cp; else break;
  }
  return applicable;
}
function applyScheduledScoring(){
  if(!DB_READY || !CURRENT_LEAGUE) return;
  const lg = league();
  if(!lg) return;
  const wk = lg.settings.week;
  const games = lg.games[wk] || [];
  const updates = [];
  games.forEach(g=>{
    if(!g.scoreTimeline || g.status==="final") return;
    const cp = computeTimelineState(g);
    if(!cp) return;
    const newStatus = cp.status || "live";
    const newPeriod = cp.period || null;
    if(g.favScore!==cp.fav || g.dogScore!==cp.dog || g.status!==newStatus || g.periodLabel!==newPeriod){
      updates.push({id:g.id, fav:cp.fav, dog:cp.dog, status:newStatus, period:newPeriod});
    }
  });
  if(!updates.length) return;
  const justFinalizedIds = updates.filter(u=>u.status==="final").map(u=>u.id);
  mutate(draft=>{
    const dl = draft.leagues[CURRENT_LEAGUE];
    (dl.games[wk]||[]).forEach(g=>{
      const u = updates.find(x=>x.id===g.id);
      if(u){ g.favScore=u.fav; g.dogScore=u.dog; g.status=u.status; g.periodLabel=u.period; }
    });
  }).then(()=> notifyFinalizedPicks(wk, justFinalizedIds));
}
// Builds a standard checkpoint schedule matching: 40 real minutes per quarter, a 20-minute
// halftime after Q2, and at least one score change every 20 minutes of actual game clock
// (halftime itself has no plays, so the score right before it just carries through unchanged).
// scores: array of 9 cumulative [fav,dog] pairs for minutes 20,40,60,80,100,120,140,160,180.
function buildScoreTimeline(scores){
  // Index i is the label that applies starting AT mins[i] (e.g. the min:40 checkpoint is already
  // "2nd Quarter", since Q1 is the 0-40 window and Q2 begins the instant it ends).
  const periods = ["1st Quarter","2nd Quarter","2nd Quarter","Halftime","3rd Quarter","3rd Quarter","4th Quarter","4th Quarter"];
  const mins = [20,40,60,80,100,120,140,160,180];
  const cps = [{min:0, fav:0, dog:0, period:"1st Quarter"}];
  mins.forEach((min,i)=>{
    cps.push({min, fav:scores[i][0], dog:scores[i][1], period: min===180 ? null : periods[i], status: min===180 ? "final" : "live"});
  });
  return cps;
}
// Two reminder types, both foreground-only (see notification settings copy):
//  - Once per league+week, at Wednesday noon (spreads reveal at Wednesday midnight, so
//    picks are open by then) — "spreads are live, go make your picks."
//  - Once per game, an hour before kickoff, but ONLY if this user still hasn't picked it.
// NOTIFIED_REMINDERS is in-memory only (like the rest of this test DB) so it resets on reload.
const NOTIFIED_REMINDERS = new Set();
function checkPickReminders(){
  if(!DB_READY || !CURRENT_LEAGUE) return;
  const u = currentUser();
  if(!u || !u.notifPrefs || !u.notifPrefs.push) return;
  if(!("Notification" in window) || Notification.permission!=="granted") return;
  const lg = league();
  if(!lg) return;
  const wk = lg.settings.week;
  const games = (lg.games[wk]||[]).filter(g=>g.status==="scheduled");
  if(!games.length) return;
  const myPicks = lg.picks[SESSION_PHONE] || {};

  const noonKey = `${lg.code}:${wk}:wedNoon`;
  if(!NOTIFIED_REMINDERS.has(noonKey)){
    const wedMidnight = new Date(computeSpreadRevealTime(games[0].kickoff)).getTime();
    const wedNoon = wedMidnight + 12*3600*1000;
    if(nowMs() >= wedNoon){
      NOTIFIED_REMINDERS.add(noonKey);
      const unpicked = games.filter(g=> !myPicks[g.id]).length;
      if(unpicked>0) new Notification("Spreads are live", {body:`Week ${wk} picks are open — ${unpicked} game${unpicked===1?"":"s"} still need${unpicked===1?"s":""} your pick.`});
    }
  }

  games.forEach(g=>{
    if(myPicks[g.id]) return; // already picked, no reminder needed
    const key = `${g.id}:kickoffReminder`;
    if(NOTIFIED_REMINDERS.has(key)) return;
    const hrs = hoursUntil(g.kickoff);
    if(hrs<=1 && hrs>-0.5){
      NOTIFIED_REMINDERS.add(key);
      new Notification("1 hour to kickoff", {body:`You haven't picked ${g.fav.n} vs ${g.dog.n} yet.`});
    }
  });
}
async function syncLiveScores(){
  if(MOCK_NOW!==null) return; // real-time ESPN polling would fight simulated/mock-clock testing data
  if(SYNC_IN_FLIGHT || !CURRENT_LEAGUE || !DB_READY) return;
  const lg = league();
  if(!lg) return;
  const wk = lg.settings.week;
  const games = lg.games[wk] || [];
  const trackable = games.filter(g=> g.espnId && g.status!=="final");
  if(trackable.length===0) return;
  SYNC_IN_FLIGHT = true;
  try{
    const sport = lg.settings.sport || "cfb";
    // A league's internal week counter doesn't always match ESPN's own week numbering for that
    // sport (e.g. an NFL test league relabeling ESPN's preseason weeks 2-3 as its own weeks 1-2)
    // — nflWeekMap lets a league override which real ESPN week to query per internal week.
    const espnWk = (sport==="nfl" && lg.settings.nflWeekMap && lg.settings.nflWeekMap[wk]) || wk;
    const url = sport==="nfl"
      ? `https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?seasontype=1&week=${espnWk}&limit=50`
      : `https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&year=${seasonYear()}&seasontype=2&week=${wk}&limit=200`;
    const res = await fetch(url);
    if(!res.ok) return;
    const data = await res.json();
    const byId = {};
    (data.events||[]).forEach(ev=>{ byId[ev.id] = ev; });

    let changed = false;
    const justFinalizedIds = [];
    await mutate(draft=>{
      const dl = draft.leagues[CURRENT_LEAGUE];
      const list = dl.games[wk] || [];
      list.forEach(g=>{
        if(!g.espnId || g.status==="final") return;
        const ev = byId[g.espnId];
        const comp = ev && ev.competitions && ev.competitions[0];
        if(!comp) return;
        const home = comp.competitors.find(c=>c.homeAway==="home");
        const away = comp.competitors.find(c=>c.homeAway==="away");
        if(!home || !away) return;
        const favC = g.favIsHome ? home : away;
        const dogC = g.favIsHome ? away : home;
        const favScore = parseInt(favC.score,10);
        const dogScore = parseInt(dogC.score,10);
        const state = comp.status && comp.status.type && comp.status.type.state;
        const newStatus = state==="in" ? "live" : (state==="post" ? "final" : "scheduled");
        const periodLabel = (comp.status && comp.status.type && comp.status.type.shortDetail) || null;
        if(g.favScore!==favScore || g.dogScore!==dogScore || g.status!==newStatus || g.periodLabel!==periodLabel){
          g.favScore = isNaN(favScore) ? g.favScore : favScore;
          g.dogScore = isNaN(dogScore) ? g.dogScore : dogScore;
          g.status = newStatus;
          g.periodLabel = periodLabel;
          changed = true;
          if(newStatus==="final") justFinalizedIds.push(g.id);
        }
      });
    });
    if(changed) render();
    notifyFinalizedPicks(wk, justFinalizedIds);
  }catch(err){
    console.error("live sync failed", err);
  }finally{
    SYNC_IN_FLIGHT = false;
  }
}

// Maps a real baseball inning onto the football-style quarter labels the rest of the app already
// understands, per an explicit ask: 1-2 -> Q1, 3-4 -> Q2, 5 -> Halftime, 6-7 -> Q3, 8+ -> Q4.
function inningToQuarterLabel(inning){
  if(inning<=2) return "1st Quarter";
  if(inning<=4) return "2nd Quarter";
  if(inning===5) return "Halftime";
  if(inning<=7) return "3rd Quarter";
  return "4th Quarter";
}
// Generic real-data scraper for a single test game: any game carrying a `liveDataSource` field
// ({sport, league, teamName}) gets its score pulled from a completely different real ESPN
// scoreboard (e.g. MLB) instead of the predetermined scoreTimeline or the CFB feed — a way to
// see how the live-score plumbing handles genuinely real, unpredictable data. `liveDataProxySide`
// picks whether the scraped team's score stands in for our "fav" or "dog" side.
let EXTERNAL_SYNC_IN_FLIGHT = false;
async function syncExternalDataSources(){
  if(EXTERNAL_SYNC_IN_FLIGHT || !CURRENT_LEAGUE || !DB_READY) return;
  const lg = league();
  if(!lg) return;
  const wk = lg.settings.week;
  const targets = (lg.games[wk]||[]).filter(g=> g.liveDataSource && g.status!=="final");
  if(!targets.length) return;
  EXTERNAL_SYNC_IN_FLIGHT = true;
  try{
    for(const g of targets){
      const src = g.liveDataSource;
      try{
        const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${src.sport}/${src.league}/scoreboard`);
        if(!res.ok) continue;
        const data = await res.json();
        const matchesTeam = c => c.team.displayName===src.teamName || c.team.shortDisplayName===src.teamName || c.team.name===src.teamName;
        const ev = (data.events||[]).find(e=> e.competitions?.[0]?.competitors?.some(matchesTeam));
        if(!ev) continue;
        const comp = ev.competitions[0];
        const home = comp.competitors.find(c=>c.homeAway==="home");
        const away = comp.competitors.find(c=>c.homeAway==="away");
        if(!home || !away) continue;
        const sourceIsHome = matchesTeam(home);
        const sourceC = sourceIsHome ? home : away;
        const otherC = sourceIsHome ? away : home;
        const sourceScore = parseInt(sourceC.score,10);
        const otherScore = parseInt(otherC.score,10);
        const state = comp.status?.type?.state;
        const newStatus = state==="in" ? "live" : (state==="post" ? "final" : "scheduled");
        const inning = comp.status?.period || null;
        const periodLabel = newStatus==="live" && inning ? inningToQuarterLabel(inning) : (newStatus==="final" ? null : null);
        const proxySide = g.liveDataProxySide || "fav";
        const favScore = proxySide==="fav" ? sourceScore : otherScore;
        const dogScore = proxySide==="dog" ? sourceScore : otherScore;
        if(g.favScore!==favScore || g.dogScore!==dogScore || g.status!==newStatus || g.periodLabel!==periodLabel){
          await mutate(draft=>{
            const dg = (draft.leagues[CURRENT_LEAGUE].games[wk]||[]).find(x=>x.id===g.id);
            if(!dg) return;
            dg.favScore = isNaN(favScore) ? dg.favScore : favScore;
            dg.dogScore = isNaN(dogScore) ? dg.dogScore : dogScore;
            dg.status = newStatus;
            dg.periodLabel = periodLabel;
          });
        }
      }catch(err){ console.error("external data scrape failed for", g.id, err); }
    }
  } finally {
    EXTERNAL_SYNC_IN_FLIGHT = false;
  }
}

/* =========================================================================
   STANDINGS
   ========================================================================= */
// Pause is stored as a list of week-ranges per member so it's fully reversible: unpausing
// stops the penalty going forward, and "Reset" wipes the history entirely (undoes a mistake).
// Pause is timestamp-based, not week-based: a game only counts as an auto-loss if its kickoff
// happens at-or-after the moment someone was paused (i.e. it hadn't locked in yet) and before
// any unpause. A game that had already kicked off — win, loss, or push — keeps its real grade;
// pausing someone mid-week doesn't retroactively touch what they'd already locked in.
function isPausedForGame(lg, phone, game){
  const ranges = (lg.paused && lg.paused[phone]) || [];
  const kickoffMs = new Date(game.kickoff).getTime();
  return ranges.some(r=> kickoffMs >= r.pausedAt && (r.unpausedAt==null || kickoffMs < r.unpausedAt));
}
function isPausedNow(lg, phone){
  const ranges = (lg.paused && lg.paused[phone]) || [];
  return ranges.some(r=> r.unpausedAt==null);
}

// A "week complete" gate is more reliable than a hard "Monday" check since real slates can run
// into Sunday/Monday night — the recap becomes available the moment every game has a final score.
function weekIsComplete(lg, week){
  const games = lg.games[week] || [];
  return games.length>0 && games.every(g=> g.status==="final");
}
function maybeShowWeeklyRecap(){
  const lg = league(), u = currentUser();
  if(!lg || !u) return;
  const week = lg.settings.week;
  if((u.recapSeen && u.recapSeen[CURRENT_LEAGUE])===week) return; // already seen this week's recap
  if(!weekIsComplete(lg, week)) return;
  openWeeklyRecap(week);
  mutate(draft=>{
    const du = draft.users[SESSION_PHONE];
    du.recapSeen = du.recapSeen || {};
    du.recapSeen[CURRENT_LEAGUE] = week;
    // Move everyone's active picking week forward once the completed week's recap has been
    // shown — last week's final scores stay reachable via the Leaderboard's week dropdown,
    // and the new week just sits there (no picks open) until its spreads reveal Wednesday.
    const dl = draft.leagues[CURRENT_LEAGUE];
    if(!dl.settings.weekOverride && dl.settings.week===week) dl.settings.week = week+1;
  });
}
// Shared by the recap and the per-game "who picked" reveal — nobody's pick is visible to
// anyone else until the game itself locks (kickoff/deadline passes), at which point it can't
// change anyone's strategy anymore, so revealing it is just fun rather than a leak.
function pickersFor(lg, g, side){
  return lg.members
    .filter(p=> (lg.picks[p]||{})[g.id]===side)
    .map(p=>DB.users[p]).filter(Boolean);
}
function avatarsHtml(list){
  return list.length
    ? list.map(u=>`<div class="mini-avatar" title="${esc(u.name)}">${esc(initials(u.name))}</div>`).join('')
    : `<span class="recap-none">nobody picked this</span>`;
}
function recapGameHtml(lg, g){
  const cover = computeCover(g);
  const isPush = cover==="push";
  const sideCls = side => isPush ? "recap-push" : (cover===side ? "recap-cover" : "recap-nocover");
  const teamBlock = (team, side, score) => `<div class="recap-team ${sideCls(side)}">
      ${teamBadgeHtml(team,40)}
      <div class="recap-team-name">${esc(team.n)}</div>
      <div class="recap-score">${score}</div>
      <div class="mini-avatar-row">${avatarsHtml(pickersFor(lg, g, side))}</div>
    </div>`;
  // Same "*ABBR -7.5" home-team line used on the Scores tab.
  const homeTeam = g.favIsHome===true ? g.fav : g.favIsHome===false ? g.dog : null;
  const homeLine = g.favIsHome===true ? g.spread : g.favIsHome===false ? -g.spread : null;
  const lineTxt = (homeTeam && homeLine!=null) ? `*${teamAbbr(homeTeam)} ${homeLine<0?homeLine:'+'+homeLine}` : null;
  return `<div class="recap-game">
    <div class="recap-kickoff" style="display:flex;justify-content:space-between;align-items:center">
      <span>${esc(fmtKickoff(g.kickoff))}</span>
      ${lineTxt ? `<span class="line-txt">${esc(lineTxt)}</span>` : ''}
    </div>
    <div class="recap-matchup">
      ${teamBlock(g.fav, "fav", g.favScore)}
      ${teamBlock(g.dog, "dog", g.dogScore)}
    </div>
    ${isPush ? `<div class="recap-push-tag">PUSHED — nobody covered</div>` : ''}
  </div>`;
}
function completedWeeks(lg){
  return Object.keys(lg.games).map(w=>parseInt(w,10)).filter(w=>weekIsComplete(lg,w)).sort((a,b)=>a-b);
}
function latestCompletedWeek(lg){
  const weeks = completedWeeks(lg);
  return weeks.length ? weeks[weeks.length-1] : null;
}
async function openWeeklyRecap(week){
  const lg = league();
  if(!lg) return;
  const weeks = completedWeeks(lg);
  if(week==null) week = latestCompletedWeek(lg);
  if(week==null){ showToast("No completed weeks yet — recaps show up once a week's games are all final."); return; }
  await ensureWeekSuperlatives(week);
  const lg2 = league();
  const idx = weeks.indexOf(week);
  const prevWeek = idx>0 ? weeks[idx-1] : null;
  const nextWeek = idx>=0 && idx<weeks.length-1 ? weeks[idx+1] : null;
  const games = (lg2.games[week]||[]).slice().sort((a,b)=> new Date(a.kickoff)-new Date(b.kickoff));
  const root = $("modalRoot");
  root.innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
    <div class="modal-sheet"><div class="modal-handle"></div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        <button class="icon-btn" style="width:30px;height:30px" onclick="openWeeklyRecap(${prevWeek})" ${prevWeek==null?'disabled':''}>‹</button>
        <div class="modal-title" style="margin-bottom:0;flex:1">Week ${week} Recap</div>
        <button class="icon-btn" style="width:30px;height:30px" onclick="openWeeklyRecap(${nextWeek})" ${nextWeek==null?'disabled':''}>›</button>
      </div>
      <div class="muted" style="margin-bottom:16px">Every game, chronologically, and who covered.</div>
      ${weeklySuperlativesHtml(lg2, week)}
      ${games.map(g=>recapGameHtml(lg2,g)).join('') || `<div class="empty-hint">No games this week.</div>`}
      <button class="btn btn-primary" style="margin-top:4px" onclick="closeModal()">Done</button>
    </div></div>`;
}

    dl.paused = dl.paused || {};
    dl.paused[phone] = dl.paused[phone] || [];
    if(!dl.paused[phone].some(r=>r.unpausedAt==null)) dl.paused[phone].push({pausedAt: nowMs(), unpausedAt: null});
  });

    const ranges = (dl.paused && dl.paused[phone]) || [];
    const open = ranges.find(r=>r.unpausedAt==null);
    if(open) open.unpausedAt = nowMs();
  });

function computeStandings(lg, uptoWeek){
  const rows = lg.members.map(phone=>{
    const u = DB.users[phone];
    let wins=0, losses=0, pushes=0;
    Object.keys(lg.games).forEach(wk=>{
      if(uptoWeek!=null && parseInt(wk,10)>uptoWeek) return;
      (lg.games[wk]||[]).forEach(g=>{
        if(g.status!=="final") return;
        if(isPausedForGame(lg, phone, g)){ losses++; return; }
        const cover = computeCover(g);
        if(!cover) return;
        const pick = (lg.picks[phone]||{})[g.id];
        if(!pick) return;
        if(cover==="push") pushes++;
        else if(pick===cover) wins++;
        else losses++;
      });
    });
    const total = wins+losses+pushes;
    const pct = total? wins/(wins+losses||1) : 0;
    return { phone, name:u?.name||"Unknown", favTeam:u?.favTeam, wins, losses, pushes, pct, paused: isPausedNow(lg, phone) };
  });
  rows.sort((a,b)=> b.pct-a.pct || b.wins-a.wins || a.losses-b.losses || a.name.localeCompare(b.name));
  return rows;
}
